<script>
(() => {
  'use strict';

  // ───────── 데이터 로드 ─────────
  const meta = JSON.parse(document.getElementById('data-meta').textContent);

  /** 모든 강의 모음. id = "코스/차시" */
  const lessons = {};

  document.querySelectorAll('script[type="text/markdown"][data-lesson]').forEach(s => {
    const id  = s.dataset.lesson;
    const raw = s.textContent;
    const {frontmatter, body} = parseFrontmatter(raw);
    lessons[id] = { id, frontmatter, body, quiz: null };
  });

  document.querySelectorAll('script[type="application/json"][data-quiz]').forEach(s => {
    const id = s.dataset.quiz;
    try {
      const quiz = JSON.parse(s.textContent);
      if (lessons[id]) lessons[id].quiz = quiz;
    } catch(e) {
      console.warn('퀴즈 JSON 파싱 실패:', id, e);
    }
  });

  function parseFrontmatter(text) {
    // CRLF/CR을 LF로 정규화 + 앞뒤 공백 제거.
    // <script type="text/markdown"> 태그 안의 textContent는 항상 '\n---'로
    // 시작하므로 trim 없이는 ^--- 정규식이 매칭에 실패해 프론트매터를 통째로
    // 본문으로 흘려보낸다(= 화면에 raw "title: …" 코드가 노출되는 원인).
    text = String(text || '').replace(/\r\n?/g, '\n').trim();
    const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
    if (!m) return { frontmatter:{}, body:text };
    const fm = {};
    for (const line of m[1].split('\n')) {
      const idx = line.indexOf(':');
      if (idx === -1) continue;
      const k = line.slice(0, idx).trim();
      let v = line.slice(idx+1).trim();
      if (v.startsWith('[') && v.endsWith(']')) {
        const inner = v.slice(1,-1).trim();
        v = inner ? inner.split(',').map(x => x.trim().replace(/^["']|["']$/g,'')) : [];
      } else if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
        v = v.slice(1,-1);
      } else if (/^-?\d+(\.\d+)?$/.test(v)) {
        v = Number(v);
      }
      fm[k] = v;
    }
    return { frontmatter: fm, body: m[2] };
  }

  // ───────── 상태 (localStorage) ─────────
  const STATE_KEY = 'ai-fluency-hub-v1';
  const state = loadState();

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STATE_KEY)) || newState(); }
    catch { return newState(); }
  }
  function newState() {
    return { progress:{}, quizResults:{}, notes:{}, highlights:{}, lastLesson:null, expandedCourse:null };
  }
  function saveState() {
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }

  // ───────── 친근한 라벨 ─────────
  // 'aiff/aif4e/taif' 같은 내부 코드는 화면에 절대 노출하지 않는다.
  // 짧은 한국어 이름으로만 보여준다.
  const COURSE_LABELS = {
    aiff:  '기초 과정',
    aif4e: '교사 활용',
    taif:  '가르치기'
  };
  function courseLabel(courseId) {
    return COURSE_LABELS[courseId] || courseId;
  }
  /** "aiff/02b-4d-framework" → { courseId, lessonSlug, index1, title, courseLabel } */
  function lessonInfo(fullId) {
    const [cid, lid] = String(fullId || '').split('/');
    const course = meta.courses.find(c => c.id === cid);
    const idx = course ? course.lessons.indexOf(lid) : -1;
    const lesson = lessons[fullId];
    return {
      courseId: cid,
      lessonSlug: lid,
      index1: idx >= 0 ? idx + 1 : null,
      title: lesson?.frontmatter?.title || lid,
      courseLabel: courseLabel(cid),
    };
  }
  /** 화면에 표시할 짧은 라벨 — 예: "교사용 · 2차시" */
  function lessonShortLabel(fullId) {
    const info = lessonInfo(fullId);
    return info.index1 ? `${info.courseLabel} · ${info.index1}차시` : info.courseLabel;
  }
  /** 좀 더 긴 라벨 — 예: "교사용 · 2차시 · 4D 프레임워크 — AI Fluency의 네 기둥" */
  function lessonLongLabel(fullId) {
    const info = lessonInfo(fullId);
    const head = info.index1 ? `${info.courseLabel} · ${info.index1}차시` : info.courseLabel;
    return `${head} · ${info.title}`;
  }

  // ───────── 아이콘 (lucide 기반 인라인 SVG) ─────────
  // UI 헤딩·버튼·카드에는 이모지 대신 의미가 또렷한 아이콘을 쓴다.
  const ICON_PATHS = {
    check:   '<path d="M20 6 9 17l-5-5"/>',
    arrow:   '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    book:    '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    note:    '<path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/>',
    quiz:    '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
    route:   '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
    layers:  '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
    clock:   '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    lightbulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
    home:    '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    gauge:   '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  };
  function ic(name, cls = 'w-5 h-5') {
    const p = ICON_PATHS[name] || '';
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  }

  // ───────── 뷰 라우터 ─────────
  let currentView = 'home';
  let currentLessonId = null;

  function setView(view, lessonId=null) {
    currentView = view;
    currentLessonId = lessonId;
    // 검색 뷰는 별도 탭이 없으므로 어떤 탭도 활성화하지 않음
    document.querySelectorAll('.view-tab').forEach(b => {
      const active = b.dataset.view === view;
      b.classList.toggle('bg-brand-600', active);
      b.classList.toggle('text-white', active);
      b.classList.toggle('shadow-sm', active);
      b.classList.toggle('text-slate-600', !active);
      b.classList.toggle('hover:bg-slate-100', !active);
      b.setAttribute('aria-current', active ? 'page' : 'false');
    });
    renderSidebar();
    renderContent();
    window.scrollTo({top:0, behavior:'instant'});
  }

  // ───────── 사이드바 렌더 ─────────
  function renderSidebar() {
    const sb = document.getElementById('sidebar');
    if (currentView === 'home' || currentView === 'lesson') {
      sb.innerHTML = meta.courses.map(c => courseCard(c)).join('');
    } else {
      // 다른 뷰에서도 사이드바 유지 (홈 돌아가기 버튼)
      sb.innerHTML = `
        <button class="flex items-center gap-3 w-full text-left px-4 py-3 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 transition" data-action="go-home">
          <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-100 text-slate-600">${ic('home','w-5 h-5')}</span>
          <span>
            <span class="block text-xs text-slate-500">돌아가기</span>
            <span class="block font-bold text-slate-900">홈 화면으로</span>
          </span>
        </button>
      ` + meta.courses.map(c => courseCard(c)).join('');
    }
  }

  /** 현재 펼쳐져야 하는 코스 — 사용자가 명시한 것 > 현재 보는 강의의 코스 > 첫 코스 */
  function activeExpandedCourse() {
    if (state.expandedCourse && meta.courses.some(c => c.id === state.expandedCourse)) {
      return state.expandedCourse;
    }
    if (currentLessonId) {
      const cid = currentLessonId.split('/')[0];
      if (meta.courses.some(c => c.id === cid)) return cid;
    }
    return meta.courses[0]?.id;
  }

  function courseCard(c) {
    const completed = c.lessons.filter(l => state.progress[`${c.id}/${l}`]?.completed).length;
    const pct = Math.round(100 * completed / c.lessons.length);
    // 펼침 여부는 오직 state.expandedCourse가 결정한다 (접기 버튼이 확실히 동작하도록).
    const isOpen = state.expandedCourse === c.id;
    const label = courseLabel(c.id);
    const ci = meta.courses.findIndex(x => x.id === c.id) + 1;
    return `
      <div class="bg-white rounded-2xl border ${isOpen ? 'border-brand-200' : 'border-slate-200'} overflow-hidden transition-colors">
        <button type="button" data-action="toggle-course" data-id="${c.id}"
          class="w-full text-left px-4 pt-4 pb-3.5 hover:bg-slate-50 transition flex items-start gap-3"
          aria-expanded="${isOpen}">
          <span class="flex-1 min-w-0">
            <span class="flex items-center gap-1.5">
              <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-brand-50 text-brand-700 text-[11px] font-bold">${ci}</span>
              <span class="inline-flex items-center text-xs font-semibold text-brand-700 bg-brand-50 px-2 py-0.5 rounded-full">${escapeHtml(label)}</span>
            </span>
            <span class="block font-bold text-slate-900 mt-2 leading-snug">${escapeHtml(c.title)}</span>
            <span class="mt-2.5 h-1.5 bg-slate-100 rounded-full overflow-hidden block">
              <span class="h-full bg-brand-500 rounded-full transition-all block" style="width:${pct}%"></span>
            </span>
            <span class="mt-1 text-xs text-slate-500 block">${completed}/${c.lessons.length}차시 완료</span>
          </span>
          <svg class="w-5 h-5 text-slate-400 mt-1 flex-shrink-0 transition-transform ${isOpen ? 'rotate-180' : ''}"
               fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        ${isOpen ? `
          <ul class="divide-y divide-slate-100 border-t border-slate-100">
            ${c.lessons.map((lid, i) => lessonRow(c.id, lid, i+1)).join('')}
          </ul>
        ` : ''}
      </div>
    `;
  }

  function lessonRow(courseId, lessonSlug, idx) {
    const id = `${courseId}/${lessonSlug}`;
    const lesson = lessons[id];
    const title = lesson?.frontmatter?.title || lessonSlug;
    const done = !!state.progress[id]?.completed;
    const active = currentLessonId === id;
    const quizScore = state.quizResults[id]?.score;
    return `
      <li>
        <button data-action="open-lesson" data-id="${id}"
          class="w-full text-left px-4 py-3 hover:bg-slate-50 transition flex items-start gap-3 ${active ? 'bg-brand-50' : ''}">
          <span class="mt-0.5 inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold shrink-0 ${done ? 'bg-brand-600 text-white' : (active ? 'bg-brand-100 text-brand-700' : 'bg-slate-100 text-slate-500')}">
            ${done ? ic('check','w-3.5 h-3.5') : idx}
          </span>
          <span class="flex-1 min-w-0">
            <span class="block text-sm font-medium ${active ? 'text-brand-800' : 'text-slate-800'} leading-snug">${escapeHtml(title)}</span>
            ${quizScore !== undefined ? `<span class="mt-1 inline-flex items-center gap-1 text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded-md">퀴즈 ${quizScore}점</span>` : ''}
          </span>
        </button>
      </li>
    `;
  }

  // ───────── 콘텐츠 렌더 ─────────
  function renderContent() {
    const el = document.getElementById('content');
    if (currentView === 'home')      el.innerHTML = renderHome();
    else if (currentView === 'lesson') el.innerHTML = renderLesson(currentLessonId);
    else if (currentView === 'quiz')   el.innerHTML = renderQuizHub();
    else if (currentView === 'cards')  el.innerHTML = renderCards();
    else if (currentView === 'notes')  el.innerHTML = renderNotes();
    else if (currentView === 'search') el.innerHTML = renderSearch(searchQuery);
    // 부드러운 진입 애니메이션 재시작
    el.classList.remove('hub-fade'); void el.offsetWidth; el.classList.add('hub-fade');
    afterRender();
  }

  function renderHome() {
    const totalLessons = meta.courses.reduce((s,c)=>s+c.lessons.length, 0);
    const completed = Object.values(state.progress).filter(p=>p?.completed).length;
    const quizCount = Object.keys(state.quizResults).length;
    const noteCount = Object.values(state.notes).filter(v => v && v.trim()).length;
    const last = state.lastLesson && lessons[state.lastLesson];
    const overallPct = Math.round(100 * completed / totalLessons);

    // 첫 화면 주 행동: 이어서 학습 > 처음 시작
    const firstLesson = `${meta.courses[0].id}/${meta.courses[0].lessons[0]}`;
    const ctaId = last ? state.lastLesson : firstLesson;
    const ctaLabel = last ? '이어서 학습하기' : '기초 과정부터 시작하기';

    const statTile = (label, value) => `
      <div class="rounded-xl bg-white/10 px-3 py-2.5">
        <div class="text-xs text-brand-50/80">${label}</div>
        <div class="mt-0.5 text-lg font-bold">${value}</div>
      </div>`;

    return `
      <div class="space-y-5">
        <!-- 히어로 (단색 — 그라데이션 미사용) -->
        <section class="bg-brand-700 text-white rounded-2xl p-6 sm:p-8 shadow-sm">
          <div class="text-sm font-semibold text-brand-100">${escapeHtml(meta.subtitle)}</div>
          <h1 class="mt-1.5 text-2xl sm:text-3xl font-extrabold leading-tight">${escapeHtml(meta.siteTitle)}</h1>
          <p class="mt-3 text-brand-50/90 leading-relaxed max-w-2xl">
            앤트로픽 아카데미의 AI Fluency 강의를 한국어로 정리한 학습 공간입니다.
            차시마다 핵심 정리·비유·연수 자료·퀴즈가 함께 있어요. 아래에서 바로 시작해 보세요.
          </p>
          <button data-action="open-lesson" data-id="${ctaId}"
            class="mt-5 inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-white text-brand-700 font-bold text-sm hover:bg-brand-50 transition">
            ${ic('arrow','w-4 h-4')}<span>${ctaLabel}</span>
          </button>
          <div class="mt-6 grid grid-cols-3 gap-2 max-w-md">
            ${statTile('완료 차시', `${completed}<span class="text-sm font-medium text-brand-100">/${totalLessons}</span>`)}
            ${statTile('푼 퀴즈', quizCount)}
            ${statTile('내 메모', noteCount)}
          </div>
        </section>

        ${last ? `
          <button data-action="open-lesson" data-id="${state.lastLesson}"
            class="block w-full text-left bg-white border border-slate-200 rounded-2xl p-5 hover:border-brand-300 hover:bg-brand-50/40 transition group">
            <div class="flex items-center gap-4">
              <span class="inline-flex items-center justify-center w-11 h-11 rounded-xl bg-brand-50 text-brand-700 shrink-0">${ic('arrow','w-5 h-5')}</span>
              <span class="flex-1 min-w-0">
                <span class="block text-xs font-semibold text-slate-500">계속 이어서 학습</span>
                <span class="block mt-0.5 font-bold text-slate-900 truncate group-hover:text-brand-700">${escapeHtml(last.frontmatter.title || state.lastLesson)}</span>
                <span class="block mt-0.5 text-xs text-slate-500">${escapeHtml(lessonShortLabel(state.lastLesson))}</span>
              </span>
            </div>
          </button>
        ` : ''}

        <div>
          <h2 class="px-1 text-sm font-bold text-slate-500">세 개의 과정</h2>
          <div class="mt-2.5 grid grid-cols-1 lg:grid-cols-3 gap-4">
            ${meta.courses.map((c, ci) => {
              const done = c.lessons.filter(l => state.progress[`${c.id}/${l}`]?.completed).length;
              const pct = Math.round(100 * done / c.lessons.length);
              return `
              <div class="flex flex-col bg-white border border-slate-200 rounded-2xl p-5 hover:shadow-sm transition">
                <div class="flex items-center gap-2">
                  <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-brand-50 text-brand-700 text-sm font-bold">${ci+1}</span>
                  <span class="inline-flex items-center text-xs font-semibold text-brand-700 bg-brand-50 px-2 py-0.5 rounded-full">${escapeHtml(courseLabel(c.id))}</span>
                </div>
                <div class="mt-2.5 text-base font-bold text-slate-900 leading-snug">${escapeHtml(c.title)}</div>
                <p class="mt-1.5 text-sm text-slate-600 leading-relaxed flex-1">${escapeHtml(c.description)}</p>
                <div class="mt-3.5">
                  <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-brand-500 rounded-full transition-all" style="width:${pct}%"></div>
                  </div>
                  <div class="mt-1.5 text-xs text-slate-500">${done}/${c.lessons.length}차시 완료</div>
                </div>
                <button data-action="open-lesson" data-id="${c.id}/${c.lessons[0]}"
                  class="mt-4 inline-flex items-center justify-center gap-1.5 w-full py-2.5 rounded-xl bg-slate-100 text-slate-800 text-sm font-semibold hover:bg-slate-200 transition">
                  ${done ? '이어서 보기' : '과정 시작하기'} ${ic('arrow','w-4 h-4')}
                </button>
              </div>`;
            }).join('')}
          </div>
        </div>

        <details class="bg-white border border-slate-200 rounded-2xl overflow-hidden group">
          <summary class="flex items-center gap-2.5 px-5 py-4 cursor-pointer select-none text-sm font-semibold text-slate-700 hover:bg-slate-50">
            <span class="text-brand-600">${ic('lightbulb','w-5 h-5')}</span>
            새 강의를 추가하려면 (관리자용)
          </summary>
          <div class="px-5 pb-5 pt-1 text-sm text-slate-600 leading-relaxed border-t border-slate-100">
            <p class="mt-3">
              <code class="bg-slate-100 px-1.5 py-0.5 rounded">courses/{과정}/NN-제목.md</code> 와
              <code class="bg-slate-100 px-1.5 py-0.5 rounded">NN-제목.quiz.json</code> 을 만들고
              <code class="bg-slate-100 px-1.5 py-0.5 rounded">_course.json</code> 에 등록한 뒤
              <code class="bg-slate-100 px-1.5 py-0.5 rounded">python build.py</code> 를 실행하면 반영됩니다.
              번거로우면 Claude에게 <em>“새 강의 추가해줘”</em>라고만 해도 됩니다.
            </p>
          </div>
        </details>
      </div>
    `;
  }

  function renderLesson(id) {
    const lesson = lessons[id];
    if (!lesson) {
      return `<div class="bg-white border border-slate-200 rounded-2xl p-6">
        <div class="font-bold text-slate-900">강의를 찾을 수 없어요</div>
        <p class="mt-2 text-sm text-slate-600">"${escapeHtml(id)}" — 데이터가 비어 있는 것 같습니다.
        <code class="bg-slate-100 px-1.5 py-0.5 rounded">python build.py</code>를 실행해보세요.</p>
      </div>`;
    }
    // lastLesson 기록
    state.lastLesson = id;
    saveState();

    const fm = lesson.frontmatter || {};
    const done = !!state.progress[id]?.completed;
    const myNote = state.notes[id] || '';
    const bodyHtml = renderMarkdown(lesson.body || '');

    // 다음 추천
    const next = (fm.nextSuggested && fm.nextSuggested.length) ? fm.nextSuggested : findDefaultNext(id);

    const info = lessonInfo(id);
    const diff = Number(fm.difficulty) || 0;
    const diffLabel = ['', '입문', '기본', '심화'][diff] || '';
    return `
      <article class="space-y-5">
        <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8">
          <div class="flex flex-wrap items-center gap-x-3 gap-y-2 text-xs">
            <span class="inline-flex items-center text-xs font-semibold text-brand-700 bg-brand-50 px-2.5 py-1 rounded-full">
              ${escapeHtml(info.courseLabel)}${info.index1 ? ` · ${info.index1}차시` : ''}
            </span>
            ${fm.duration ? `<span class="inline-flex items-center gap-1 text-slate-500">${ic('clock','w-3.5 h-3.5')}${escapeHtml(fm.duration)}</span>`: ''}
            ${diff ? `<span class="inline-flex items-center gap-1.5 text-slate-500">${ic('gauge','w-3.5 h-3.5')}난이도 ${diffLabel} <span class="tracking-tight text-brand-500">${'●'.repeat(diff)}<span class="text-slate-300">${'●'.repeat(3-diff)}</span></span></span>`: ''}
          </div>
          <h1 class="mt-3 text-2xl sm:text-[1.9rem] font-extrabold text-slate-900 leading-tight">${escapeHtml(fm.title||id)}</h1>
          ${(fm.tags||[]).length ? `<div class="mt-3 flex flex-wrap gap-1.5">${(fm.tags||[]).map(t => `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-xs">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          ${fm.metaphor ? `
            <div class="mt-5 flex gap-3 px-4 py-3.5 rounded-xl bg-brand-50 border border-brand-100 text-brand-900 leading-relaxed">
              <span class="text-brand-600 shrink-0 mt-0.5">${ic('compass','w-5 h-5')}</span>
              <span><span class="font-bold">비유로 이해하기</span><br><span class="text-[0.95rem]">${escapeHtml(fm.metaphor)}</span></span>
            </div>` : ''}
          <div class="prose mt-6" id="lesson-body">${bodyHtml}</div>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-slate-100 text-slate-600">${ic('note','w-5 h-5')}</span>
              <div>
                <div class="font-bold text-slate-900">내 메모</div>
                <div class="text-xs text-slate-500 mt-0.5">생각·실험 계획·동료에게 전할 메시지를 자유롭게</div>
              </div>
            </div>
            ${myNote ? `<span class="text-xs font-medium text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full shrink-0">저장됨</span>` : ''}
          </div>
          <label for="note-input" class="sr-only">이 차시에 대한 메모</label>
          <textarea id="note-input" rows="4"
            class="mt-3 w-full rounded-xl border border-slate-200 p-3 text-sm leading-relaxed focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none"
            placeholder="자유롭게 적어두세요. 자동 저장됩니다.">${escapeHtml(myNote)}</textarea>
        </div>

        ${lesson.quiz ? `
          <div class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-6">
            <div class="flex items-center gap-2.5">
              <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-50 text-brand-700">${ic('quiz','w-5 h-5')}</span>
              <div>
                <div class="font-bold text-slate-900">이해 확인 퀴즈</div>
                <div class="text-sm text-slate-600 mt-0.5">${escapeHtml(lesson.quiz.title || '이해 확인')} · 총 ${lesson.quiz.questions.length}문항</div>
              </div>
            </div>
            <div class="mt-4 flex flex-wrap items-center gap-3">
              <button data-action="start-quiz" data-id="${id}"
                class="px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition">
                ${state.quizResults[id] ? '퀴즈 다시 풀기' : '퀴즈 시작하기'}
              </button>
              ${state.quizResults[id] ? `
                <span class="text-sm text-slate-600">지난 점수 <span class="font-bold text-brand-700">${state.quizResults[id].score}/${state.quizResults[id].total}</span></span>` : ''}
            </div>
          </div>` : ''}

        <div class="flex flex-wrap gap-3 pt-1">
          <button data-action="toggle-complete" data-id="${id}"
            class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl ${done ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-brand-600 text-white'} font-semibold text-sm hover:opacity-90 transition">
            ${done ? `${ic('check','w-4 h-4')}완료함 · 누르면 취소` : `${ic('check','w-4 h-4')}이 차시 완료로 표시`}
          </button>
          ${next.map(nid => {
            const nl = lessons[nid];
            if (!nl) return '';
            const ni = lessonInfo(nid);
            return `<button data-action="open-lesson" data-id="${nid}"
              class="inline-flex items-center gap-2.5 px-4 py-2.5 rounded-xl bg-slate-100 text-slate-800 font-semibold text-sm hover:bg-slate-200 transition text-left">
              <span>
                <span class="text-xs font-medium text-slate-500 block">다음 · ${escapeHtml(ni.courseLabel)}${ni.index1 ? ` · ${ni.index1}차시` : ''}</span>
                <span class="block mt-0.5">${escapeHtml(nl.frontmatter.title || nid)}</span>
              </span>
              ${ic('arrow','w-4 h-4 shrink-0 text-slate-400')}
            </button>`;
          }).join('')}
        </div>
      </article>
    `;
  }

  function findDefaultNext(id) {
    // _meta.learningPath.edges에서 from === id
    return meta.learningPath.edges.filter(e => e.from === id).map(e => e.to);
  }

  function renderCards() {
    // 비유 + 연수 자료를 카드로 모아 보여줌
    const allLessons = [];
    meta.courses.forEach(c => c.lessons.forEach(l => {
      const id = `${c.id}/${l}`;
      if (lessons[id]) allLessons.push(lessons[id]);
    }));

    return `
      <div class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-6">
          <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-50 text-brand-700">${ic('layers','w-5 h-5')}</span>
            <h1 class="text-xl font-bold text-slate-900">비유 · 연수 카드</h1>
          </div>
          <p class="mt-3 text-sm text-slate-600 leading-relaxed">
            연수 자리에서 한 장씩 보여주기 좋은 카드 모음입니다. 차시별 한 줄 비유와
            연수에서 강조할 포인트를 정리했어요.
          </p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${allLessons.map(l => {
            const fm = l.frontmatter;
            const trainingBlock = extractSection(l.body, '연수 자료');
            return `
              <div class="flex flex-col bg-white border border-slate-200 rounded-2xl p-5">
                <div class="text-xs font-semibold text-brand-700 bg-brand-50 inline-block self-start px-2 py-0.5 rounded-full">${escapeHtml(lessonShortLabel(l.id))}</div>
                <div class="mt-2 font-bold text-slate-900 leading-snug">${escapeHtml(fm.title || l.id)}</div>
                ${fm.metaphor ? `
                  <div class="mt-3 flex gap-2.5 px-3.5 py-3 rounded-xl bg-brand-50 border border-brand-100 text-brand-900 text-sm leading-relaxed">
                    <span class="text-brand-600 shrink-0 mt-0.5">${ic('compass','w-4 h-4')}</span>
                    <span>${escapeHtml(fm.metaphor)}</span>
                  </div>` : ''}
                ${trainingBlock ? `
                  <details class="mt-3">
                    <summary class="cursor-pointer text-sm font-bold text-slate-700 hover:text-brand-700">연수 자료 펼쳐 보기</summary>
                    <div class="prose mt-2">${renderMarkdown(trainingBlock)}</div>
                  </details>` : ''}
                <button data-action="open-lesson" data-id="${l.id}"
                  class="mt-3 inline-flex items-center gap-1.5 self-start text-sm text-brand-700 font-semibold hover:underline">강의 보기 ${ic('arrow','w-4 h-4')}</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderNotes() {
    const entries = Object.entries(state.notes).filter(([,v]) => v && v.trim());
    return `
      <div class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-6">
          <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-50 text-brand-700">${ic('note','w-5 h-5')}</span>
            <h1 class="text-xl font-bold text-slate-900">내 메모</h1>
          </div>
          <p class="mt-3 text-sm text-slate-600">강의를 들으며 적어둔 메모를 한자리에서 모아 봅니다.</p>
        </div>
        ${entries.length === 0 ? `
          <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-10 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-100 text-slate-400">${ic('note','w-6 h-6')}</div>
            <p class="mt-3 text-slate-500 text-sm">아직 메모가 없어요. 강의를 보면서 자유롭게 적어보세요.</p>
          </div>
        ` : entries.map(([id, note]) => {
          const l = lessons[id];
          return `
            <div class="bg-white border border-slate-200 rounded-2xl p-5">
              <div class="text-xs font-semibold text-brand-700 bg-brand-50 inline-block px-2 py-0.5 rounded-full">${escapeHtml(lessonShortLabel(id))}</div>
              <button data-action="open-lesson" data-id="${id}" class="flex items-center gap-1.5 mt-2 text-sm text-slate-900 font-bold hover:text-brand-700 hover:underline text-left">
                ${escapeHtml(l?.frontmatter?.title || id)} ${ic('arrow','w-3.5 h-3.5')}
              </button>
              <div class="mt-2 whitespace-pre-wrap text-sm text-slate-800 leading-relaxed">${escapeHtml(note)}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // ───────── 검색 ─────────
  let searchQuery = '';
  function renderSearch(q) {
    if (!q || q.trim().length < 2) {
      return `<div class="bg-white border border-slate-200 rounded-2xl p-6 text-slate-600 text-sm">
        검색어를 2글자 이상 입력해주세요.
      </div>`;
    }
    const needle = q.toLowerCase();
    const hits = [];
    Object.values(lessons).forEach(l => {
      const text = (l.frontmatter.title||'') + '\n' + (l.frontmatter.metaphor||'') + '\n' + l.body;
      const idx = text.toLowerCase().indexOf(needle);
      if (idx !== -1) {
        const start = Math.max(0, idx - 40);
        const end   = Math.min(text.length, idx + 100);
        const snippet = text.slice(start, end).replace(/\n+/g,' ');
        hits.push({ id: l.id, title: l.frontmatter.title||l.id, snippet, idx });
      }
    });
    hits.sort((a,b) => a.idx - b.idx);
    return `
      <div class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-6">
          <h1 class="text-xl font-bold text-slate-900">검색 결과 — "${escapeHtml(q)}"</h1>
          <p class="mt-2 text-sm text-slate-600">${hits.length}건이 나왔어요.</p>
        </div>
        ${hits.length === 0 ? `
          <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-10 text-center text-slate-500 text-sm">
            일치하는 강의가 없어요. 다른 키워드로 시도해보세요.
          </div>
        ` : hits.map(h => `
          <button data-action="open-lesson" data-id="${h.id}"
            class="block w-full text-left bg-white border border-slate-200 rounded-2xl p-5 hover:bg-slate-50 transition">
            <div class="text-xs font-semibold text-brand-700 bg-brand-50 inline-block px-2 py-0.5 rounded-full">${escapeHtml(lessonShortLabel(h.id))}</div>
            <div class="mt-2 font-bold text-slate-900">${escapeHtml(h.title)}</div>
            <div class="mt-2 text-sm text-slate-700 leading-relaxed">…${highlightSnippet(h.snippet, needle)}…</div>
          </button>
        `).join('')}
      </div>
    `;
  }

  function highlightSnippet(text, needle) {
    const escaped = escapeHtml(text);
    const re = new RegExp(escapeRegex(needle), 'gi');
    return escaped.replace(re, m => `<mark class="user-highlight">${m}</mark>`);
  }
  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  // ───────── 마크다운 렌더 ─────────
  function renderMarkdown(md) {
    if (window.marked) {
      marked.setOptions({ breaks: true, gfm: true });
      return marked.parse(md);
    }
    return `<pre>${escapeHtml(md)}</pre>`;
  }

  function extractSection(body, headingText) {
    // ## headingText ~ 다음 ## 사이 추출
    const re = new RegExp(`##\\s+${escapeRegex(headingText)}[^\\n]*\\n([\\s\\S]*?)(?:\\n##\\s+|$)`);
    const m = body.match(re);
    return m ? m[1].trim() : '';
  }

  // ───────── 퀴즈 ─────────
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** scope: 'all' 또는 코스 id → 해당 범위의 모든 문항을 모은다 */
  function quizPool(scope) {
    const courseIds = scope === 'all' ? meta.courses.map(c => c.id) : [scope];
    const pool = [];
    courseIds.forEach(cid => {
      const course = meta.courses.find(c => c.id === cid);
      if (!course) return;
      course.lessons.forEach(lid => {
        const l = lessons[`${cid}/${lid}`];
        if (l && l.quiz && Array.isArray(l.quiz.questions)) {
          l.quiz.questions.forEach(q => pool.push({ ...q, _src: l.frontmatter.title || lid }));
        }
      });
    });
    return pool;
  }

  /** 범용 퀴즈 진행기. quiz={title,questions,passingScore}, opts={label,srcVisible,onFinish,finalMessage,finalActions} */
  function runQuiz(quiz, opts) {
    opts = opts || {};
    const el = document.getElementById('content');
    const total = quiz.questions.length;
    let i = 0, correct = 0;

    function frame(inner) {
      el.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8">${inner}</div>`;
      el.classList.remove('hub-fade'); void el.offsetWidth; el.classList.add('hub-fade');
    }
    function topBar() {
      return `
        <div class="flex items-center justify-between text-xs text-slate-500">
          <span class="font-medium truncate pr-2">${escapeHtml(opts.label || '퀴즈')}</span>
          <span class="shrink-0">${i+1} / ${total}</span>
        </div>
        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full bg-brand-500 rounded-full transition-all" style="width:${(i)/total*100}%"></div>
        </div>`;
    }
    function srcTag(q) {
      return (opts.srcVisible && q._src) ? `<div class="mt-2 text-xs text-slate-400">${escapeHtml(q._src)}</div>` : '';
    }

    function showQ() {
      const q = quiz.questions[i];
      frame(`
        ${topBar()}
        <h2 class="mt-5 text-lg sm:text-xl font-bold text-slate-900 leading-snug">${fmtInline(q.question)}</h2>
        ${srcTag(q)}
        <div class="mt-4 space-y-2">
          ${q.options.map((opt, idx) => `
            <button data-opt="${idx}"
              class="w-full text-left px-4 py-3 rounded-xl border border-slate-200 hover:border-brand-400 hover:bg-brand-50 transition text-sm leading-relaxed flex items-start gap-2.5">
              <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-700 text-xs font-bold shrink-0">${String.fromCharCode(65+idx)}</span>
              <span>${fmtInline(opt)}</span>
            </button>`).join('')}
        </div>`);
      el.querySelectorAll('button[data-opt]').forEach(b => {
        b.addEventListener('click', () => showResult(Number(b.dataset.opt)));
      });
    }

    function showResult(picked) {
      const q = quiz.questions[i];
      const right = picked === q.answer;
      if (right) correct++;
      frame(`
        ${topBar()}
        <h2 class="mt-5 text-lg sm:text-xl font-bold text-slate-900 leading-snug">${fmtInline(q.question)}</h2>
        ${srcTag(q)}
        <div class="mt-4 space-y-2">
          ${q.options.map((opt, idx) => {
            const isAns = idx === q.answer, isPick = idx === picked;
            let cls = 'border-slate-200';
            if (isAns) cls = 'border-emerald-500 bg-emerald-50';
            else if (isPick && !isAns) cls = 'border-rose-300 bg-rose-50';
            return `
              <div class="px-4 py-3 rounded-xl border ${cls} text-sm leading-relaxed flex items-start gap-2.5">
                <span class="inline-flex items-center justify-center w-6 h-6 rounded-full ${isAns ? 'bg-emerald-600 text-white' : (isPick ? 'bg-rose-400 text-white' : 'bg-slate-100 text-slate-700')} text-xs font-bold shrink-0">
                  ${isAns ? ic('check','w-3.5 h-3.5') : (isPick ? '×' : String.fromCharCode(65+idx))}
                </span>
                <span>${fmtInline(opt)}</span>
              </div>`;
          }).join('')}
        </div>
        <div class="mt-5 px-4 py-3 rounded-xl ${right ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-amber-50 border border-amber-200 text-amber-900'} text-sm leading-relaxed">
          <span class="font-semibold">${right ? '잘 보셨어요. ' : '한 번 더 생각해볼까요? '}</span>${fmtInline(q.explanation || '')}
        </div>
        <button id="next-q" class="mt-5 px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition">
          ${i+1 < total ? '다음 문제' : '결과 보기'}
        </button>`);
      document.getElementById('next-q').addEventListener('click', () => {
        i++;
        if (i < total) showQ(); else showFinal();
      });
    }

    function showFinal() {
      const passed = correct >= (quiz.passingScore ?? Math.ceil(total*0.6));
      if (opts.onFinish) opts.onFinish({ correct, total, passed });
      frame(`
        <div class="text-center">
          <div class="inline-flex items-center justify-center w-20 h-20 rounded-full ${passed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} text-3xl font-bold">
            ${correct}<span class="text-base opacity-70">/${total}</span>
          </div>
          <h2 class="mt-4 text-xl font-bold text-slate-900">${passed ? '잘하셨어요!' : '거의 다 왔어요!'}</h2>
          <p class="mt-2 text-sm text-slate-600 leading-relaxed">${opts.finalMessage ? opts.finalMessage({correct,total,passed}) : (passed ? '핵심 내용을 잘 이해하셨네요.' : '해설을 참고해 한 번 더 풀어볼까요?')}</p>
          <div class="mt-6 flex flex-wrap justify-center gap-3">
            ${opts.finalActions ? opts.finalActions({correct,total,passed}) : ''}
          </div>
        </div>`);
    }

    showQ();
  }

  function startQuiz(id) {
    const lesson = lessons[id];
    if (!lesson || !lesson.quiz) return;
    runQuiz(lesson.quiz, {
      label: `퀴즈 · ${lesson.frontmatter.title || id}`,
      onFinish: ({ correct, total, passed }) => {
        state.quizResults[id] = { score: correct, total, ts: Date.now() };
        if (passed) state.progress[id] = { ...(state.progress[id]||{}), completed: true };
        saveState();
      },
      finalMessage: ({ passed }) => passed
        ? '핵심 내용을 잘 이해하셨네요. 강의가 완료 처리되었습니다.'
        : '한 번 더 강의를 훑어보고 다시 풀어볼까요? 틀린 문제의 해설이 도움이 될 거예요.',
      finalActions: () => `
        <button data-action="open-lesson" data-id="${id}" class="px-5 py-3 rounded-xl bg-slate-100 text-slate-800 font-semibold text-sm hover:bg-slate-200 transition">강의로 돌아가기</button>
        <button data-action="start-quiz" data-id="${id}" class="px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition">다시 풀기</button>`
    });
  }

  // ───────── 전체(랜덤) 퀴즈 ─────────
  let quizScope = 'all';
  let quizCount = '10';   // '5' | '10' | 'all'
  function scopeLabel(scope) { return scope === 'all' ? '전체' : courseLabel(scope); }

  function startMixedQuiz(scope, count) {
    const pool = shuffle(quizPool(scope));
    if (!pool.length) return;
    const n = (count === 'all') ? pool.length : Math.min(Number(count) || 10, pool.length);
    const questions = pool.slice(0, n);
    runQuiz({ title: '전체 퀴즈', questions, passingScore: Math.ceil(n * 0.6) }, {
      label: `전체 퀴즈 · ${scopeLabel(scope)}`,
      srcVisible: true,
      finalMessage: ({ correct, total }) => `${total}문항 중 ${correct}문항을 맞혔어요. 무작위라 다시 풀면 새 문제가 나와요.`,
      finalActions: () => `
        <button data-action="go-quiz" class="px-5 py-3 rounded-xl bg-slate-100 text-slate-800 font-semibold text-sm hover:bg-slate-200 transition">퀴즈 설정으로</button>
        <button data-action="retry-mixed-quiz" class="px-5 py-3 rounded-xl bg-brand-600 text-white font-semibold text-sm hover:bg-brand-700 transition">새 문제로 다시</button>`
    });
  }

  function renderQuizHub() {
    const scopes = [{ id:'all', label:'전체' }].concat(meta.courses.map(c => ({ id:c.id, label:courseLabel(c.id) })));
    const avail = quizPool(quizScope).length;
    const counts = [{ v:'5', l:'5문항' }, { v:'10', l:'10문항' }, { v:'all', l:`전체 ${avail}문항` }];
    const startN = (quizCount === 'all') ? avail : Math.min(Number(quizCount), avail);

    const scopeChips = scopes.map(s => {
      const active = quizScope === s.id;
      const n = quizPool(s.id).length;
      return `<button data-action="set-quiz-scope" data-scope="${s.id}"
        class="px-4 py-2.5 rounded-xl text-sm font-semibold border transition ${active ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-700 border-slate-200 hover:border-brand-300'}">
        ${escapeHtml(s.label)} <span class="${active ? 'text-brand-100' : 'text-slate-400'}">· ${n}문항</span>
      </button>`;
    }).join('');

    const countChips = counts.map(c => {
      const active = String(quizCount) === String(c.v);
      const disabled = (c.v !== 'all' && Number(c.v) > avail);
      return `<button data-action="set-quiz-count" data-count="${c.v}" ${disabled ? 'disabled' : ''}
        class="px-4 py-2.5 rounded-xl text-sm font-semibold border transition ${active ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-700 border-slate-200 hover:border-brand-300'} ${disabled ? 'opacity-40 cursor-not-allowed' : ''}">
        ${escapeHtml(c.l)}
      </button>`;
    }).join('');

    return `
      <div class="space-y-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-6">
          <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-brand-50 text-brand-700">${ic('quiz','w-5 h-5')}</span>
            <h1 class="text-xl font-bold text-slate-900">전체 퀴즈</h1>
          </div>
          <p class="mt-3 text-sm text-slate-600 leading-relaxed">선택한 과정의 여러 차시에서 문제를 무작위로 모아 한 번에 풀어봅니다. 복습에 좋아요.</p>
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl p-6 space-y-5">
          <div>
            <h2 class="text-sm font-bold text-slate-500">1. 범위 고르기</h2>
            <div class="mt-2.5 flex flex-wrap gap-2">${scopeChips}</div>
          </div>
          <div>
            <h2 class="text-sm font-bold text-slate-500">2. 문항 수</h2>
            <div class="mt-2.5 flex flex-wrap gap-2">${countChips}</div>
          </div>
          <div class="pt-1">
            ${avail === 0
              ? `<p class="text-sm text-slate-500">이 범위에는 풀 수 있는 문제가 없어요.</p>`
              : `<button data-action="start-mixed-quiz"
                  class="inline-flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-3.5 rounded-xl bg-brand-600 text-white font-bold text-sm hover:bg-brand-700 transition">
                  ${ic('quiz','w-4 h-4')} ${escapeHtml(scopeLabel(quizScope))} 퀴즈 ${startN}문항 시작하기
                </button>`}
          </div>
        </div>
      </div>`;
  }

  // ───────── 이벤트 핸들러 (이벤트 위임) ─────────
  // 사이드바·콘텐츠는 innerHTML로 자주 새로 그려지므로, 요소마다 리스너를
  // 다는 방식은 재렌더 후 죽는다. document에 단 한 번만 위임한다.
  let globalEventsBound = false;
  function bindGlobalEvents() {
    if (globalEventsBound) return;
    globalEventsBound = true;
    document.body.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const action = el.dataset.action;
      const id = el.dataset.id;
      if (action === 'open-lesson') {
        const cid = String(id || '').split('/')[0];
        if (cid && meta.courses.some(c => c.id === cid)) {
          state.expandedCourse = cid;   // 강의를 열면 그 코스를 펼침
          saveState();
        }
        setView('lesson', id);
      }
      else if (action === 'go-home') setView('home');
      else if (action === 'go-quiz') setView('quiz');
      else if (action === 'toggle-course') {
        // 같은 코스 다시 누르면 접고, 다른 코스 누르면 그쪽을 펼침
        state.expandedCourse = (state.expandedCourse === id) ? null : id;
        saveState();
        renderSidebar();
      }
      else if (action === 'toggle-complete') {
        state.progress[id] = state.progress[id] || {};
        state.progress[id].completed = !state.progress[id].completed;
        saveState();
        renderSidebar();
        renderContent();
      }
      else if (action === 'start-quiz') startQuiz(id);
      else if (action === 'set-quiz-scope') { quizScope = el.dataset.scope; renderContent(); }
      else if (action === 'set-quiz-count') { quizCount = el.dataset.count; renderContent(); }
      else if (action === 'start-mixed-quiz' || action === 'retry-mixed-quiz') {
        startMixedQuiz(quizScope, quizCount);
      }
    });
  }

  function afterRender() {
    // 메모 자동 저장 (강의를 그릴 때마다 새 textarea가 생기므로 매번 연결)
    const note = document.getElementById('note-input');
    if (note) {
      let t;
      note.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          state.notes[currentLessonId] = note.value;
          saveState();
        }, 400);
      });
    }
  }

  // ───────── 검색 입력 ─────────
  const sInput = document.getElementById('search-input');
  let searchTimer;
  sInput.addEventListener('input', () => {
    searchQuery = sInput.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (searchQuery.trim().length >= 2) setView('search');
      else if (currentView === 'search') setView('home');
    }, 200);
  });

  // ───────── 탭 클릭 ─────────
  document.querySelectorAll('.view-tab').forEach(b => {
    b.addEventListener('click', () => setView(b.dataset.view));
  });

  document.getElementById('btn-home').addEventListener('click', () => setView('home'));

  // ───────── 유틸 ─────────
  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  // 퀴즈 문항 등 마크다운을 안 거치는 짧은 텍스트의 *강조*를 굵게 처리
  function fmtInline(s) {
    return escapeHtml(s).replace(/\*([^*\n]+)\*/g, '<strong class="font-bold text-slate-900">$1</strong>');
  }

  // ───────── 초기 렌더 ─────────
  // 처음 로드 시 펼칠 코스 기본값 (마지막 본 강의의 코스 > 첫 코스).
  // 사용자가 세션 중 접으면(null) 그 상태를 유지한다.
  if (!meta.courses.some(c => c.id === state.expandedCourse)) {
    state.expandedCourse = (state.lastLesson && state.lastLesson.split('/')[0]) || meta.courses[0].id;
  }
  bindGlobalEvents();
  setView('home');
})();
</script>

</body>
</html>
