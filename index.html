## 한 줄 요약

AI에 접근만 한다고 *fluent*해지지 않는다. 효과적·효율적·윤리적·안전하게 일하는 능력은 *별도로* 길러야 하며, 그 시작은 **AI와 일하는 세 가지 방식**을 구별하는 데서 출발한다.

## 핵심 정리

### AI Fluency의 정의

AI 시스템과 **효과적·효율적·윤리적·안전**하게 일하는 *실용 능력·지식·통찰·가치*의 묶음. 특정 프롬프트 10개 외우기가 아니다.

### AI와 일하는 *세 가지 모드*

#### 🔧 Automation (자동화)
AI가 *내가 정한 작업*을 *내 지시대로* 수행. 명확한 결과를 머릿속에 그릴 수 있을 때 강력.
- 예: 문서 요약, 이메일 초안, 여행 일정.

#### 🤝 Augmentation (증강)
AI와 사람이 *함께* 사고하고 *함께* 작업. 답이 빤하지 않고 *탐색이 필요한* 일에 강력.
- 예: 소설 인물 만들기, 아키텍처 고민, 연구 주제 정리.

#### 🎬 Agency (에이전시)
AI가 *내 대신* 독립적으로 일함. 구체 지시가 아니라 *AI의 지식·행동 패턴*을 *세팅*.
- 예: 이메일 자동 분류·답장 초안, 상호작용 캐릭터, 챗봇.

### 셋 중 무엇이 *더 낫지는 않다*

세 모드는 *목적이 다르다*. 한 프로젝트에서 *셋 다* 쓸 수도 있다. 다만 *Augmentation과 Agency*가 AI의 *고유 능력*을 가장 잘 살린다.

### AI는 *도구 그 이상*

도구(망치처럼) → 매체(붓처럼) → 파트너(동료처럼) → 공동 창작자. *한 번의 작업 안에서도 역할이 바뀐다*. 그래서 *새 역할에 맞는 새 능력*이 필요하다 — 그게 4D 프레임워크.

## 비유로 이해하기 🪜

**AI는 *학교에 새로 부임한 다재다능한 동료*다.**

- *Automation*: "이 가정통신문 좀 다듬어 주세요" — 명확한 부탁.
- *Augmentation*: "이번 학년 부적응 학생 사례를 같이 고민해주실래요?" — 함께 생각.
- *Agency*: "쉬는 시간 학생 행동 일지 자동 분류 좀 세팅해주세요" — 일하는 *방식*을 부탁.

같은 동료지만 **부탁의 모양이 다르면 결과도 완전히 다르다.**

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의
> "AI Fluency는 '챗봇 잘 쓰기'가 아니에요. AI와 *효과적·효율적·윤리적·안전*하게 일하는 *모든* 능력의 집합이에요. 시작은 AI와 일하는 *세 가지 방식*을 구별하는 것."

### 연수 활동 아이디어
- **3모드 사례 분류**: 자기 일주일 동안의 AI 사용을 3모드로 분류 → 어떤 모드에 편중?
- **모드 의도적 바꾸기**: 평소 *Automation*으로 쓰던 일 하나를 *Augmentation*으로.

## 더 깊이

> "AI isn't just a tool. It's a technology that can act as a tool, but also as a medium or as a partner or co-creator."

## 한 줄 요약

AI와 일하는 *어떤 모드*에서든 통하는 4가지 핵심 능력 — **Delegation·Description·Discernment·Diligence**. 도구가 바뀌어도 *살아남는* 능력.

## 핵심 정리

### 4D — 한 눈에

| D | 다루는 일 | 한 줄 정의 |
|---|---|---|
| **Delegation** | 큰 그림 — 누가 뭘 할까 | 무엇을 이루려는지·내가 할지 AI가 할지 정한다 |
| **Description** | 소통 — AI에 어떻게 말할까 | 결과물·방식·행동 톤을 *말로 풀어* AI를 진짜 협업자로 |
| **Discernment** | 평가 — 결과가 좋은지 | AI 출력의 *질·과정·태도*를 분별하고 다듬는다 |
| **Diligence** | 책임 — 어떻게 책임질까 | AI 사용에 대한 *신중함·투명성·책임*을 끝까지 |

### 1️⃣ Delegation
- *Problem Awareness*: 내가 해결하려는 게 정확히 뭐지?
- *Platform Awareness*: 어떤 AI가 잘하고 못하는지 안다
- *Task Delegation*: 사람·AI 각자의 강점에 맞춰 분담

### 2️⃣ Description
프롬프트 *한 줄*이 아니다. **맥락 풍부한 대화**:
- *결과물 형식*은 어떤지 (Product)
- *과정·접근*은 어떻게 (Process)
- AI가 *어떤 행동 톤*으로 함께 (Performance)

### 3️⃣ Discernment
*전문성*에 기반한 판단. *언제 다듬고 언제 버려야 할지* 안다.
Discernment는 *Description과 짝* — 부탁→결과→평가→다시 부탁의 *작은 루프*가 협업의 핵심.

### 4️⃣ Diligence
AI로 만든 결과를 *자기 이름으로* 내보내겠다는 자세. 안전·윤리적 협업의 핵심.

### 4D가 *변화에 강한* 이유

이 네 가지는 **특정 AI 도구·기법에 묶여 있지 않다.** 도구가 바뀌어도 *판단·소통·평가·책임* 자체는 늘 필요하다.

## 비유로 이해하기 🪜

**4D는 함께 사는 네 식구다.**
- **Delegation** = 가장 — *오늘 누가 뭘 할지* 정한다
- **Description** = 말 잘하는 식구 — 부탁할 때 *명확하고 친절하게*
- **Discernment** = 살림하는 식구 — *맛이 어떤지·간이 맞는지* 본다
- **Diligence** = 가족 대표 — *밖에서 일이 생기면* 책임진다

한 명만 잘해서는 안 굴러간다.

## 연수 자료

### 한 줄 정의
> "4D는 AI와 일하는 모든 모드에서 필요한 *4가지 핵심 능력*이에요. **위임·설명·분별·책임**. 특정 도구가 사라져도 *살아남는* 능력입니다."

### 헷갈리기 쉬운 포인트 3가지
1. *Delegation = 떠넘기기?* ❌ — *비전과 전략적 분담*
2. *Description = 프롬프트?* ❌ — *맥락 풍부한 대화*
3. *Diligence = 별 일 없으면 안 봐도 되는 것?* ❌ — *모든 단계에 흐른다*

## 더 깊이

> "What makes these competencies so valuable is that they aren't tied to specific AI tools or techniques that might become outdated."

## 한 줄 요약

생성형 AI(LLM)는 *분석*이 아니라 *생성*을 한다. 어떻게 작동하는지 알면, *왜 신기한지*도, *왜 가끔 틀리는지*도 자연스럽게 보인다.

## 핵심 정리

### Generative AI = *새로 만드는* AI

| 기존 AI | 생성형 AI |
|---|---|
| 이메일을 *스팸/정상* 분류 | 새 이메일을 *완전히 새로 작성* |
| 기존 데이터 *분석·분류* | 없던 콘텐츠 *창조* |

### LLM이란
- **Language Model**: 사람의 언어를 *예측·생성*하도록 학습
- **Large**: *수십억 개*의 *파라미터*(시냅스 연결처럼)

### 어떻게 가능해졌나 — *세 가지 발전 동시에*

1. **알고리즘** — 2017 *Transformer*. 단어들 사이 관계를 *동시에* 처리.
2. **데이터 폭증** — 웹·코드·책 같은 방대한 언어 자원.
3. **연산 폭증** — GPU/TPU·분산 컴퓨팅.

→ **Scaling Laws**: 모델·데이터·연산이 커지면 성능이 *예측 가능하게* 향상. 더 흥미롭게는 — *프로그래밍하지 않은* 능력이 어떤 규모를 넘으면 *출현*한다.

### 학습 — 두 단계

#### Pre-training
방대한 텍스트로 *"다음 단어 맞춰봐"*를 반복. *언어의 통계적 관계*를 익힘 — 내용 외우기가 아니라 *언어·지식의 복잡한 지도*.

#### Fine-tuning
*지시 따르기, 유용·정직·무해하게 답하기*를 학습. 사람 피드백·강화학습.

### 질문할 때 어떻게 답이 나오나

- 데이터베이스에서 *답을 꺼내오는* 게 아니다.
- 우리 입력을 보고 *통계적으로 가장 그럴듯한 다음 단어들*을 *그 자리에서* 만든다.
- 그래서 *같은 질문에 매번 살짝 다른 답*이 나올 수 있다.

### Context Window — 작업 기억 한계

한 번에 *고려할 수 있는 정보의 양*. 우리 프롬프트 + AI 응답 + 공유 문서 모두 포함. 모델마다 *최대 한계*가 있음.

### 모던 LLM을 *강력하게* 만드는 3가지

1. **방대한 학습** — 풍부한 패턴
2. **In-context learning** — 별도 학습 없이 *프롬프트의 예·지시*로 새 작업 적응
3. **Emerging capabilities** — *규모가 커지면 출현*하는 예상 못 한 능력

## 비유로 이해하기 🪜

**LLM은 *세상의 모든 글을 읽은 신입 동료*다.**
- 도서관·웹·교과서를 *몇 년 동안 다 읽은* 사람
- 하지만 *외워서* 답하지 않는다 — *매번 그 자리에서 가장 그럴듯한 답을 조합*한다
- 그래서 *놀라울 만큼 박학*하지만 *가끔 틀리기도* 한다
- *기억력은 무한하지 않다* (context window)

## 연수 자료

### 한 줄 정의
> "생성형 AI는 *기존 답을 꺼내오는 검색*이 아니에요. *통계적으로 가장 그럴듯한 답*을 *그 자리에서 만드는* 시스템이에요."

### 학생·동료에게 강조할 포인트 3가지
1. *"외워서 답하지 않는다"* — 그래서 hallucination이 생긴다.
2. *"확률적 도구"* — 같은 입력에 다른 출력. 재현성이 필요하면 의식적으로.
3. *"기억력은 한정적"* — 긴 대화에선 앞 내용을 잊을 수 있다.

## 더 깊이
> "The model isn't retrieving pre-written answers from a database. Instead, it's generating new text that statistically follows from what you've written."

## 한 줄 요약

LLM은 *놀라울 만큼 다재다능*하지만, *지식 컷오프·hallucination·context window·비결정성·외부 도구 부재* 같은 한계가 있다. 능력과 한계를 *같이* 알아야 fluency가 자란다.

## 핵심 정리

### 잘하는 것

| 영역 | 예시 |
|---|---|
| 언어 능력 | 내 말투의 이메일, 보고서 요약, 번역, 어려운 주제 설명 |
| 유연한 작업 전환 | *시 쓰기*와 *양자컴퓨팅*을 같은 대화에서 |
| 대화 이어가기 | 앞에서 언급한 내용을 기억·이어 받음 |
| 외부 도구 연결 | 웹 검색·파일 처리·다른 앱 |

### 한계 6가지

#### ① 지식 컷오프
훈련 시점 이후는 모름. 검색 도구 연결로 보완.

#### ② Hallucination — *자신감 있게 틀리기*
학습 데이터의 부정확성 + 통계적 생성. *그럴듯하지만 틀린* 답을 *자신 있게* 내놓기도. 검색과 다르다.

#### ③ Context Window
한 번에 다루는 정보량 한계. 한계 넘으면 *앞쪽 정보가 잊혀진다*.

#### ④ 비결정성
*같은 입력에 다른 출력*. Temperature로 조절 가능 — 낮으면 일관성, 높으면 다양성.

#### ⑤ 복잡 추론 약점 (개선 중)
수학·다단계 논리에 *역사적으로* 약점. *Reasoning models*가 빠르게 개선.

#### ⑥ 외부 도구·데이터 접근 한계
*훌륭한 동료지만 우리 회사 DB는 못 보는* 상황과 비슷. 도구 연결·RAG로 보완.

### 가장 효과적인 활용 — *상호 보완*

| 사람 | AI |
|---|---|
| 비판적 사고 · 판단 · 창의 · 윤리 · 맥락 | 속도 · 규모 · 패턴 인식 · 정보 처리 |

## 비유로 이해하기 🪜

**LLM은 *광범위하게 읽은 새 동료*다.**
- 거의 모든 분야에 대해 *대화 가능*
- *최근 일은 모른다* — 입사 전(=컷오프) 일은 모름
- *자신감 있게 틀리기도* — 모르는 걸 모른다고 잘 안 함
- *기억력은 한정적* — 한 번에 다 기억 못 함
- *우리 회사 내부 DB엔 접근 못 함* — 우리가 연결해줘야
- *같은 질문에 매번 살짝 다른 답* — 자판기가 아님

## 연수 자료

### 한 줄 정의
> "LLM은 놀라울 만큼 다재다능하지만 *지식 컷오프·hallucination·context window·비결정성·외부 접근 부재* 같은 한계가 있어요. 능력과 한계를 *같이* 알아야 같이 일할 수 있어요."

### 학생·동료에게 강조할 포인트 3가지
1. *"자신 있게 말해도 사실 확인은 필수"* — hallucination은 자신감과 무관
2. *"최근 일은 모른다는 게 기본"*
3. *"같은 질문에 다른 답이 나오는 게 정상"*

## 더 깊이
> "Understanding what AI can or cannot do is essential for AI fluency."

## 한 줄 요약

Delegation은 *떠넘기기*가 아니라 **무엇을 이루려는지·어떤 AI가 가능한지·각자의 강점에 맞춰 어떻게 나눌지** 세 인식의 결합.

## 핵심 정리

### 출발점은 *AI가 아니라 자기 자신*

가장 놀라운 사실: **좋은 Delegation의 뿌리는 AI 지식이 아니라 *자기 전문성*과 *목표에 대한 명확한 이해*다.**

AI를 끌어들이기 전:
- 정확히 무엇을 이루려는가? *성공*은 어떤 모습?
- 어떤 *종류의 일·사고*가 필요한가? (단순·시간잡아먹는 / 불확실해서 동료 필요 / 데이터 부족 / 결정적 판단)

> *내 문제를 모르면 어떤 첨단 AI도 도움 안 된다.*

### ① Problem Awareness
*내 목표·필요 작업*을 명확히. **자기 분야 전문가가 먼저, AI 위임자는 그 다음.**

### ② Platform Awareness
AI 시스템마다 *능력이 천차만별*이고 매일 진화. *완벽한 한 모델 찾기*가 아니라 *각 시스템의 강·약점 알기*. 강의 권장 = *직접 손으로 만져보기*.

### ③ Task Delegation
내 문제 + AI 풍경이 *만난다*. 네 영역:
- 어떤 부분이 **Automation** 이점?
- 어떤 부분이 **Augmentation**으로 더 큰 가치?
- 어떤 부분이 *결정적 판단*이라 **사람만** 해야?
- 어떤 *반복 인터랙션*을 **AI Agent**가?

### Delegation이 잘 안 될 때 — 점검

- 결과가 자꾸 헛돈다 → **Problem Awareness 약함**
- AI가 능력 밖 시도 → **Platform Awareness 약함**
- 좋은 결과는 나오나 *내 손길이 너무 적음* → **Task Delegation 약함** (판단까지 떠넘긴 건 아닌가)

## 비유로 이해하기 🪜

**Delegation은 학년 초 *동학년 업무 분담*과 같다.**
- *내가 뭘 맡고 싶은지*도 모르고 회의 가면 → 휘둘림 (Problem 부재)
- *동료가 뭘 잘하는지*도 모르면 → 엉뚱한 사람에게 엉뚱한 일 (Platform 부재)
- 둘은 알아도 *섞어 쓸 줄 모르면* → 한 명에 몰림 (Task 부재)

## 연수 자료

### 한 줄 정의
> "Delegation은 *AI 잘 부리기*가 아니에요. **내가 뭘 이루려는지 → 어떤 AI가 가능한지 → 어떻게 나눌지** 세 인식의 결합. 출발점은 *AI*가 아니라 *나*."

### 연수 활동
- **3가지 인식 체크**: 자기 최근 AI 프로젝트로 Problem/Platform/Task 각각 점수
- **분담 시뮬레이션**: 가정통신문 작성 흐름을 *4가지 영역*으로

## 더 깊이
> "The most effective AI collaborators are experts in their fields first and AI delegators second."

## 한 줄 요약

코스 *나머지 절반*을 함께 갈 **중간 규모 프로젝트**를 정하고, Delegation을 적용해 *계획서*를 만든다. 앞으로 Description·Discernment·Diligence도 *같은 프로젝트*로.

## 실습 단계

### Step 1 — *프로젝트 고르기*

조건:
- *여러 종류의 작업*이 섞여 있을 만큼 충실
- *약 1시간 분량* — 감당 가능
- *진짜로* 만들고 싶거나 이루고 싶은 것

추천 영역:
- **커뮤니케이션**: 발표 자료, 글·시리즈, 제안서·피치, 개인·전문 바이오
- **연구·조사**: 트렌드 정리, 데이터 패턴 분석, 비교 추천, 역사 조사
- **창작**: 단편 소설 아우트라인, 웹사이트 구조, 콘셉트
- **학습**: 학습 계획, 자료 모음, 튜토리얼, 공부 자료

> 다정초 맥락 예: *학기말 학예회 운영 가이드*, *3학년 사회과 단원 재구성*, *학부모 안내 책자*.

### Step 2 — 비전·목표 정하기

AI와 대화. *AI에게 답을 시키지 말고*, *내 비전이 또렷해질 질문*을 시킨다. 최종적으로:
- *성공*은 어떤 모습?
- 이 프로젝트가 *내게 특히 가치 있는 이유*?

### Step 3 — 작업 분해·Delegation 분석

AI와 Delegation 렌즈로:
1. *주요 작업* 식별
2. 각 작업마다 — 한 번에 하나씩 토론:
   - 필요한 *기술·지식·AI 능력*?
   - *사람만의 강점*?
   - *AI가 잘하는 부분*?
   - *협업이 큰 임팩트* 만드는 지점?
3. *계획서* 만들기
4. 저장 — *나머지 차시*에서 다시 씀

⚠ *진짜 대화*: 가정에 의문 던지고 예상 못 한 통찰에 열림.

### Step 4 — 성찰

- 계획 대화에서 *어떤 통찰*?
- *가장 어려울 부분*?
- *더 잘 위임하려면* 어떤 정보·스킬?

## 비유로 이해하기 🪜

**책으로 수영 못 배우듯, 4D도 *해봐야* 안다.**
- Lesson 2~4: *수영장 옆에서 설명 듣는 단계*
- Lesson 5: *물에 발 담그는 첫 순간*
- 처음엔 어색하다. 괜찮다 — *모든 첫 시도가 그렇다*

## 동료에게

### 한 줄 정의
> "이 차시는 영상이 아니라 *실습*. 자기 *진짜 프로젝트*로 AI와 함께 *계획서*를 만들어보는 시간. 코스 끝까지 같은 프로젝트로 4D를 단련."

### 짝과 함께
- 짝과 *프로젝트 공유*: 서로 *Delegation 분석* 점검
- *학습 일지*: 차시 마지막에 *통찰 3줄*만 적기

## 한 줄 요약

Description은 *프롬프트 잘 쓰기*가 아니다. **결과물(Product)·접근 방식(Process)·행동 톤(Performance)** 세 차원에서 *맥락을 풍부하게 공유*하는 일.

## 핵심 정리

### ① Product Description — *결과물* 명시

"로고 만들어줘" ❌ → "회사 가치·타깃·선호 색·스타일 살린 로고 시안 3개" ✅

물어볼 것:
- *작업의 맥락*은?
- AI가 *정확히* 무엇을 해주길?
- *결과물 형식*은? (글? 표? 코드? 슬라이드?)
- *청중*과 *어울리는 스타일*?

### ② Process Description — *접근 방식* 명시

가끔 결과물 자체보다 중요. 동료에게 *"이런 방식으로 접근해줘"* 부탁하듯.

방법:
- *매뉴얼 같은 큰 가이드*
- *요리책 같은 단계별 지시*
- *예시 시범* (few-shot)

> "*튜터로 도와줘*" ❌
> "*답은 알려주지 말고*, 단계마다 *내 시도부터* 묻고, *그 다음에 힌트만*." ✅

### ③ Performance Description — *행동 톤* 명시

> "AI는 *데이터베이스*도 *자판기*도 아니다. *상황에 따라 다르게 행동할 수 있는 상호작용 시스템*이다."

AI에게 *어떤 사고의 동료가 필요한지*:
- *좁혀가는* vs *넓혀가는* 사고?
- *내 가정에 도전* vs *내 흐름 따라*?
- *상세* vs *간결*?
- *왜 그렇게 답하는지 설명*까지? *답만*?

### 3가지가 *합쳐졌을 때*

AI를 *범용 도우미*에서 *나에게 정밀 조율된 사고의 동료*로 바꾼다. 강의 핵심 비유: *명령*이 아니라 *대화*.

## 비유로 이해하기 🪜

**Description은 *요리 주문*과 *함께 요리하기*의 차이다.**

| 활동 | 모습 |
|---|---|
| *주문 (=한 줄 프롬프트)* | "맛있게 만들어주세요" |
| *Product* | "4인분 카레, 매운 정도 중간, 닭고기·감자, 한국식" |
| *Process* | "양파를 갈색까지 충분히 볶고, 루는 마지막에" |
| *Performance* | "조용히 집중해서, 제가 옆에서 같이 볶는 식으로" |

같은 *카레*지만 결과 만족도가 완전히 다르다.

## 연수 자료

### 한 줄 정의
> "Description은 *프롬프트 잘 쓰기*가 아니라 *AI에게 어떤 사고 환경을 함께 짓고 싶은지* 풍부하게 전달하는 일. 3차원: **결과물·접근 방식·행동 톤**."

### 자주 받는 질문 2가지
**Q. 매번 길게?** → 짧은 작업엔 짧게. *중요 작업*일수록 3차원을 의식적으로.
**Q. Performance가 낯설어요** → *"지금 나에게 필요한 동료는 비판자·치어리더·정리꾼?"* 묻기.

### 연수 활동
- **3차원 빈칸**: 다음 AI 사용을 *3차원 표*로 — 결과 차이 관찰
- **Performance 카드**: *비판적/격려/정리꾼/회의적* 4가지로 같은 질문 시도

## 더 깊이
> "AI tools are not databases or vending machines. They are interactive systems that can behave differently in different contexts much like people might."

## 한 줄 요약

좋은 프롬프트는 *Description의 실전*. 6가지 기본 + *비밀병기 1가지*만 익혀도 도구가 바뀌어도 *살아남는 기본기*가 된다.

## 핵심 정리

### 사람 소통 + AI 작은 보정

**사람과 같은 부분**: 명확하게 / 맥락 충분히 / 구체적 예
**AI 특화 보정**: *명시적*으로 표현 / *context window* 의식 / *기계가 처리하기 쉬운* 포맷

### 6가지 기본 기법

#### 1) 맥락 주기 — *무엇·왜·누가*

"기후변화 알려줘" ❌ → "*열대 지역 농업*에 미친 *3가지 영향*을 *최근 10년 사례*와. *생태학 전공·기후변화는 잘 모르는 사람*이 *인도네시아 농업연구소 면접* 준비 상황." ✅

#### 2) 예시 보여주기 (few-shot)

*특정 스타일·변환*을 원할 때. 다양한 예를 주면 AI가 *패턴의 폭*을 잡음.

#### 3) 출력 제약·형식 명시

*형식·길이·색·코드 언어* — 구체일수록 좋다.

#### 4) 복잡한 작업 분해 (Chain-of-thought)

복잡한 일을 *작은 단계*로. AI가 *내 사고를 따라오게*. ⚠ 단순 작업엔 불필요. 단, *내 전문 지식*을 가르치는 효과.

#### 5) *먼저 생각하게* 하기 (Think-first)

답하기 *전*에 *생각할 공간*을. 핵심: 답 *후*가 아니라 *전*에 생각하게. 부수 효과: AI 사고 흐름이 보이니 *어디서 어긋나는지* 발견.

#### 6) 역할·스타일·톤 정의

"*경험 많은 과학 선생님*이 *10살에게* 설명하듯이." 특정 인물 페르소나도 가능.

### 🎯 비밀병기 — *AI에게 프롬프트를 부탁하기*

> "이런 *목표*가 있어. 어떻게 프롬프트로 풀어내야 할지 모르겠어. *좋은 프롬프트*를 *대신 써줘*."

모델마다 잘 통하는 *결*이 다르므로 각 AI에게 *그 AI에게 맞는* 프롬프트를 받기.

### 잘 안 통할 때 — 5가지

1. *구체성·맥락* 추가
2. *원하는 결과의 예* 보여주기
3. *작업을 작은 단계*로
4. *기법 조합*
5. *대화 리셋* — 길 잃은 대화는 *새로 시작*이 빠를 수도

### 자주 하는 실수

- AI가 *내 마음 읽을 거*라 가정
- 한 프롬프트에 *여러 무관한 작업* 욱여넣기
- *성공이 어떤 모습인지* 모호
- *피드백 안 주기*

## 비유로 이해하기 🪜

**프롬프트는 *새 보조 교사에게 일 부탁하기*다.**
- 사람한테 부탁할 때 — *맥락·예·기대치*가 명확하면 좋다
- AI에게는 *조금만 더 명시적*으로
- 안 통하면 — 사람한테도 그랬을 것처럼 — *예·단계·기대치 조정*

**비밀병기**: *그 사람에게 어떻게 부탁하는 게 좋겠냐고 그 사람한테 묻기.* AI는 그게 가능하다.

## 연수 자료

### 한 줄 정의
> "프롬프트 기법은 *사람한테 일 부탁할 때 통하는 원칙* + *AI 특화 보정*. 핵심 6가지(맥락·예·제약·분해·먼저 생각·역할) + 비밀병기(AI에게 프롬프트 부탁) 정도면 기본기 충분."

### 학생·동료에게 강조할 3가지
1. *한 번에 안 통하면 반복* — 첫 시도는 거의 안 맞음
2. *성공이 어떤 모습인지 내가 먼저 안다*
3. *이 분야는 바뀐다* — 기본 원칙에 집중

## 더 깊이
> "Maintain a spirit of experimentation and adapt your approach based on your results."

## 한 줄 요약

Description의 *짝*. AI 결과를 *판별*하는 안목 — **결과물·과정·태도** 셋을 같이 본다. 단순 오류 찾기가 아니라 *질·맥락·관계*의 판단.

## 핵심 정리

### Discernment의 자리

= AI 결과·과정·태도를 *비판적으로 평가*하는 능력. 협업의 *품질 관리*.

기능:
- AI 결과가 *가치 있는지·문제 있는지*
- *강점·한계* 알아보기
- *지금 쓸 수 있나·더 다듬어야 하나*

기반: ① *내 분야 전문성* + ② *AI 작동·전형적 약점* 이해

### ① Product Discernment

AI 출력 자체를 평가:
- *사실적으로* 정확한가?
- *내 청중·목적*에 적절?
- *논리·구조* 일관?
- 내 *요구*에 맞나?
- *문제 해결*에 진짜 도움?

### ② Process Discernment — *어떻게 도달했나*

알아채야 할 것:
- *논리 오류*
- AI *주의력 결핍* (디테일 흘림)
- *부적절한 단계*
- *작은 디테일에 갇힘*
- *순환 논리*

> 예: AI와 5개 outline 중 *심화 작업* 중 — 시간 지나며 *거부한 아이디어*가 슬그머니 다시.

### ③ Performance Discernment — *AI 태도·소통*

Process와 헷갈리기 쉽지만 미묘하게 다름:
- *Process* = AI가 *하는 일*
- *Performance* = AI가 *나와 소통하는 방식*

- 소통이 *생산성*에 도움?
- *피드백에 잘 반응*?
- *효율적인가, 불필요하게 복잡한가*?

### Discernment는 *평가에서 끝나지 않는다*

*피드백* 구조:
1. *문제 명시*
2. *왜 문제인지*
3. *구체적 개선 제안*
4. *지시·예 재정리*

> "Discernment가 문제를 잡으면, 더 나은 Description이 답인 경우가 많다. 다만 *항상*은 아님 — Delegation 재검토까지 갈 수도."

## 비유로 이해하기 🪜

**Discernment는 *학생 글을 채점하는 안목*이다.**
- *Product* — 글 자체의 사실·구조
- *Process* — 학생이 *어떻게 도달*했나 (논리·자료)
- *Performance* — 학생이 *수업·과제 안내에 어떻게 반응*했나

좋은 채점자는 *셋을 함께* 본다. *어디가 약한지뿐 아니라 어디서 가능성이 보이는지*도.

## 연수 자료

### 한 줄 정의
> "Discernment는 *AI 결과를 판별하는 안목*. **결과물·과정·태도** 셋을 함께 봅니다. *오류 찾기*가 아니라 *질·맥락·관계*의 판단."

### 학생·동료에게 강조할 3가지
1. *분야 전문성이 우선* — AI 협업이 *전문성 무용*이 아니라 *더 중요*인 이유
2. *문제 발견 + 가능성 발견* — AI가 보여준 *새 관점*도 알아보기
3. *피드백 구조* — 문제·이유·개선안·지시 재정리

### 연수 활동
- **3차원 평가표**: AI 출력 1건을 *Product/Process/Performance* 5분 평가
- **순환 논리 찾기**: 5턴 이상 대화에서 *거부 아이디어가 돌아온 지점* 발견

## 더 깊이
> "Discernment works hand in hand with description."

## 한 줄 요약

Lesson 5에서 만든 *내 프로젝트 계획*을 꺼내, Lesson 6~8에서 배운 Description과 Discernment를 *실전 루프*로 적용. *사람·AI 어느 쪽도 혼자선 못 만들* 결과를 향해.

## 실습 단계

### Step 1 — 프로젝트 계획 다시

Lesson 5 계획서를 꺼내 — Delegation 결정 점검. 그동안 배운 것에 비추어 *다듬어도 좋다*.

### Step 2 — Description 접근 준비

AI와 대화. *작업 시작 전에* 3차원으로 설계:

**Product**: AI가 줄 결과물·형식·스타일·길이·디테일
**Process**: AI 접근·방법·프레임워크·단계
**Performance**: 협업 행동 — 간결 vs 상세, 도전 vs 지지, 아이디어 vs 분석

### Step 3 — 루프로 실행

각 작업마다:

**A. 명확히 Description**
- 결과물 구체적 (Product)
- AI 접근 안내 (Process)
- 대화 행동 명시 (Performance)

**B. 받은 결과 Discernment**
- 결과물 평가 (Product)
- 도달 과정 평가 (Process)
- 행동·소통 평가 (Performance)

**C. Description 다듬기**
- 통한 것·안 통한 것 피드백
- Description 조정
- 원하는 결과까지 반복

**D. 내 전문성·판단 결합**
- 고유 관점·창의·분야 지식 더함
- *무엇을 남기고·바꾸고·버릴지* 최종 결정
- *최종 결과의 책임*

### Step 4 — 성찰

- *어떤 종류의 Description*이 가장 좋은 결과?
- Description vs Discernment 어느 쪽에 더 노력?
- Lesson 5 계획과 *실제 실행* 차이?

## 비유로 이해하기 🪜

**Lesson 5는 *지도 그리기*, Lesson 9는 *지도 들고 걷기*.**
- 지도 그리기만으론 *길의 흙·바람*을 모름
- 걷다 보면 *지도에 없는 샛길* 발견
- 좋은 여행자는 — 걸으면서 *지도를 다시 그린다*

## 동료에게

### 한 줄 정의
> "이번 차시도 *영상이 아니라 실습*. Lesson 5에서 만든 *같은 프로젝트*에 — Description과 Discernment를 *루프*로 적용. 사람도 AI도 혼자선 못 만드는 결과를 만들어봅니다."

### 잘 안 풀릴 때
- *결과 빗나감* → Product Description부터 점검
- *AI가 헛돔* → Process Description 강화
- *대화 답답함* → Performance Description 조정
- *그래도 안 되면* → Delegation 재검토

## 한 줄 요약

다른 3D가 *효과·효율*에 초점이라면, Diligence는 *윤리·안전*에 초점. **신중한 선택(Creation)·정직한 공개(Transparency)·결과의 책임(Deployment)** 세 차원.

## 핵심 정리

### Diligence의 자리

다른 3D가 *결과 얻기*에 가깝다면, Diligence는 *더 넓은 질문*:
- 이 AI와 일하는 *함의*?
- *누가 영향* 받나?
- *데이터 접근*은 누가?
- *내 윤리·가치*와 일치?

### 자동차 비유

A→B *빨리 가는 것*만 보지 않음. *안전·법규·다른 차에 미치는 영향*도. AI도 *진공*에서 일어나지 않는다.

### ① Creation Diligence

협업 *시작부터* 묻기:
- 이 시스템은 *어떻게 학습·구축*?
- 내 *데이터 소유권*은?
- 공유 이후 *누가 접근*?
- *나·타인 프라이버시·보안*?
- 이 상호작용이 *내 가치·정책*과 맞나?

> 예: *민감한 회사 정보*를 AI에 공유하기 *전* — 서비스의 *데이터 보호 정책*과 *조직 허용 여부*를 *먼저 확인*.

### ② Transparency Diligence

설정마다 *공개 기대치가 다르다*. 그걸 *이해하고 충족할 책임은 나*.

- *AI 역할*을 누가 알아야?
- *어떻게·언제* 알릴까?
- *어느 수준의 디테일*이 적절?

> Transparency는 *규정 준수*가 아니다. *관계의 신뢰·존중*. 사람들은 자신에게 영향을 주는 콘텐츠에 AI가 얼마나 관여했는지 알 *권리*가 있다.

### ③ Deployment Diligence

> "AI 생성 콘텐츠를 *세상에 내놓을 때* — *AI가 아니라 내가* 정확성·적절성에 책임진다."

해야 할 일:
- *사실 확인*
- *편향 점검*
- *정확성·사용권 확인*
- *내 이름으로 떳떳할 수 있게* 검토

> 비유: 기자가 AI로 초안 → *출판 전*에 *모든 사실과 출처* 검증. *직접 처음부터 쓴 것과 동일한 기준*.

### Diligence는 *체크리스트가 아니다*

권장:
- *내 윤리·가치*에 맞는 *개인 가이드라인*
- 직장에선 *조직 정책·업계 표준*
- AI 법·규제 *변화* 따라가기

## 비유로 이해하기 🪜

**Diligence는 *운전과 같다*.**
- *효율*만이 아님 — 지름길만이 아니다
- *안전* — 내가 다치지 않고, 남도 다치지 않게
- *법규* — 모두가 공유하는 *약속*
- *다른 차에 미치는 영향* — 진공에서 일어나지 않음

좋은 운전자는 *모든 차원*을 *동시에* 머리에 굴린다.

## 연수 자료

### 한 줄 정의
> "Diligence는 *책임지는 협업*. **신중한 선택·정직한 공개·결과 책임** 세 차원에서 *내가 떳떳할 수 있는* 사용을. *규정 준수의 차원이 아니라 관계 신뢰·자기 책임의 차원*."

### 자주 받는 질문 2가지
**Q. AI 사용을 밝히면 손해?** → 정반대. *명확한 협업 표시*가 *전문 역량*으로.
**Q. Creation Diligence까지 챙길 시간?** → *모든 사용*이 아니라 *민감 정보·중요 결정*에 한해.

### 연수 활동
- **개인 AI 정책 1쪽**: 어떤 데이터는 안 넣음, 어떻게 검증, 어떻게 공개
- **3차원 사례 토론**: 학교 사례 3가지에 Creation/Transparency/Deployment 적용

## 더 깊이
> "We all want AI that is fair and safe and of benefit to our society. Our own behaviors play a key role in making this happen."

## 한 줄 요약

코어 코스 마무리. **4D × 3모드**를 한눈에 정리하고, *어떻게 계속 자라날지*의 방향을 잡는다.

## 핵심 정리

### 4D 다시 한 번

| D | 본질 | 3개 하위 |
|---|---|---|
| **Delegation** | 무엇을 누가·어떻게 나눌지 | Problem · Platform · Task |
| **Description** | AI에 어떻게 말할지 | Product · Process · Performance |
| **Discernment** | 결과·과정·태도 *판별* | Product · Process · Performance |
| **Diligence** | AI 사용에 *책임* | Creation · Transparency · Deployment |

### 4D × 3모드 — *어디서나 적용*

세 모드 모두에 적용:
- **Automation** — AI가 *내 지시*대로
- **Augmentation** — AI와 *함께* 사고·작업
- **Agency** — AI가 *내 대신* 독립적으로

→ 도구·모드가 바뀌어도 **4D는 살아남는다**.

### D별 한 문장

**Delegation**: *내 전문성과 판단*이 *효과적 AI 사용의 토대*. 가장 강력한 결과는 *반복 협업*에서 나온다 — *둘 중 누구도 혼자선 못 만들* 결과.

**Description**: *명확한 소통*이 *다리*. 가장 효과적인 지시는 *정교한 프롬프트*가 아니라 *맥락·예·피드백을 담은 사려 깊은 대화*.

**Discernment**: *비판적 평가*는 *양보할 수 없는 책임*. AI 한계로부터 보호하고, 동시에 *혼자선 못 만드는* 결과로 끌어올린다.

**Diligence**: *결과의 영향*에 *내가 책임*진다. *AI 역할 공개*가 *신뢰와 정직*을.

### *완벽함이 아니라 자라남*

이 능력들은 *하룻밤*에 익혀지지 않는다. *연습으로 자란다*. 목표는 *완벽함*이 아니라 *의식·헌신·의도성*을 *계속* 키우는 일.

### 강사의 마무리

> "AI는 강력하지만 *만능 해법은 아니다*. *우리가 만든 만큼* 유용·안전해진다. 그러니: *내 전문성에 투자*, *기술 변화 주시*, *Description-Discernment 대화 연습*, *결과의 책임*."

## 비유로 이해하기 🪜

**코어 코스는 *수영 강습 1단계*다.**
- 처음엔 *물에 안 빠지는 법* — 4D 기본기
- 이제 *각 영법*을 가질 차례
- 영법마다 *기본기는 똑같다*. 응용이 다를 뿐

→ 학습 허브 다른 두 코스가 그 응용:
- **AIF4E** — *자유형* (교사 본인이 잘 헤엄치기)
- **TAIF** — *접영* (학생에게 영법을 가르치기)

## 연수 자료

### 한 줄 정의
> "코어 결론은 — *4D × 3모드*가 어디에나 통하는 *기본기*. 다음은 *내 맥락*에 따라 영법을 고를 차례 — 교사용(AIF4E) 또는 가르치기(TAIF)."

### 마무리 활동
- **개인 AI 정책 1쪽** — 코스에서 배운 걸 *나의 AI 정책*으로
- **3개월 후 점검 약속** — 동료와 *3개월 뒤* 다시 만나 어느 D가 성장·정체

## 더 깊이
> "These competencies aren't mastered overnight. They develop through practice. The goal isn't perfection — it's about continually developing awareness, commitment, and intentional approach."

## 한 줄 요약

**AI를 수업에 어떻게 들여올 것인가** — 효과적이고, 효율적이고, 윤리적이고, 안전하게. 이 질문에 답을 만들어가는 코스의 출발점.

## 이 강의가 답하는 질문

- 왜 지금 교사에게 AI Fluency가 필요한가?
- 이 코스에서 무엇을 얻을 수 있나?
- 어떤 마음가짐으로 시작하면 좋을까?

## 핵심 정리

### 1) AI Fluency는 "AI를 쓰는 능력"이 아니라 "AI와 일하는 능력"

단순히 챗봇을 잘 부려 먹는 게 아니다. AI와 함께 *생각하면서* 더 나은 결과를 만드는 능력 — 그것도 **효과적(effective)·효율적(efficient)·윤리적(ethical)·안전(safe)** 이 네 가지 모두 충족하면서.

### 2) 우리는 다음 세대가 AI를 만나는 방식을 빚는 위치에 있다

학생들은 이미 AI를 쓴다. 기업은 AI와 협업할 줄 아는 인재를 원한다. 학교가 이걸 외면하는 게 더 위험하다. 교사가 **사려 깊은 AI 사용의 본보기**가 되어야 한다.

### 3) 이 코스는 4D 프레임워크를 *교사의 일상*에 적용한다

- **Delegation** (위임): 무엇을 AI에게, 무엇을 나에게 맡길까
- **Description** (설명): AI에게 어떻게 말할까
- **Discernment** (분별): AI의 결과를 어떻게 평가할까
- **Diligence** (책임): 결과에 어떻게 책임질까

각각이 *수업 설계·자료 제작·평가*에 어떻게 녹는지를 다룰 예정.

### 4) "AI 전문가가 되라"는 코스가 아니다

저자들도 인정한다 — **누구도 AI가 어디로 갈지 정확히 모른다.** 우리는 함께 길을 찾는 중이다. 이 프레임워크는 "더 좋은 질문을 하는 법"을 알려준다. 정답을 외우는 게 아니라.

## 비유로 이해하기 🪜

**AI는 새로 온 보조 교사다.**

- 능력은 있다 — 빠르게 자료를 만들고, 다양한 관점을 알고 있다.
- 하지만 **우리 반 아이들이 누군지 모른다.** 누가 수학을 어려워하는지, 누가 발표에 떨리는지, 어떤 책을 같이 읽었는지.
- 그래서 같이 일하려면, *내가* 맥락을 알려줘야 한다. 어디까지 맡길지도 *내가* 정해야 한다.
- 보조 교사가 만든 활동지를 그대로 학생에게 주지 않듯, AI의 결과물도 내 손을 거쳐야 한다.

이 비유를 머릿속에 두면, 이 코스가 말하는 거의 모든 게 자연스러워진다.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "AI Fluency는 AI를 쓰는 기술이 아니라, AI와 함께 *생각하는* 기술입니다. 교사가 먼저 이걸 익혀야, 학생에게도 본보기가 될 수 있어요."

### 자주 받는 질문 3가지

**Q. 이거 결국 ChatGPT 잘 쓰는 법 아닌가요?**
→ 아니에요. 어떤 AI든, 5년 뒤 어떤 새 AI가 나오든 통하는 *판단 기준*을 익히는 거예요. 도구가 바뀌어도 살아남는 능력.

**Q. AI에게 다 맡기면 우리 일이 없어지는 거 아닌가요?**
→ 정반대예요. AI에게 *맡기지 말아야 할 것*을 분별하는 게 핵심이에요. 학생을 아는 일, 가치를 정하는 일, 책임지는 일 — 이건 우리만 할 수 있어요.

**Q. 어디서부터 시작해야 하나요?**
→ 다음 차시 "4D 프레임워크"부터 듣고, 자기 수업에서 한 가지만 골라 적용해보세요. 작게 시작해서 습관 들이는 게 정답이에요.

### 연수 시 강조할 포인트

1. **두려움이 아니라 호기심으로** — "AI를 막아야 할까"가 아니라 "어떻게 함께 갈까"가 출발점.
2. **교사의 전문성은 사라지지 않는다** — 오히려 더 중요해진다. AI의 결과를 *분별*하려면 *내 분야를 깊이 알아야* 한다.
3. **완벽한 답을 찾는 코스가 아니다** — 함께 길을 만드는 코스.

## 더 깊이 — 원본 강의의 핵심 문장

> "The AI Fluency Framework isn't about becoming an expert overnight. It's about learning to ask better questions in an AI-enhanced world."
> ─ 하루아침에 전문가가 되라는 게 아니다. AI가 더해진 세상에서 *더 좋은 질문을 하는 법*을 배우는 것이다.

## 한 줄 요약

AI Fluency는 **Delegation·Description·Discernment·Diligence** 네 가지가 *맞물려 돌아갈 때* 생긴다. 각각이 무엇이고, 어떻게 연결되는지를 익힌다.

## 이 강의가 답하는 질문

- AI를 "쓰는 것"과 "함께 일하는 것"의 차이는 뭔가?
- 4D는 각각 뭘 의미하나?
- 4D가 따로따로가 아니라 함께 돌아간다는 게 무슨 뜻인가?

## 큰 그림

AI Fluency의 핵심 정신은 **"사람이 사고의 중심에 있는(human-in-the-loop) 협업"** 이다.

- ❌ **Automation (자동화)**: AI에게 일을 떠넘기고 결과만 받아 쓴다. 학습에는 *최악*. AI가 우리 *대신* 일하는 방식.
- ✅ **Augmentation (증강)**: AI가 내 일을 *더 잘하게* 돕는다. 학습에 *최적*. AI가 우리 *함께* 일하는 방식.

4D는 Augmentation을 가능하게 만드는 네 가지 능력이다.

## 핵심 정리 — 4D 각각

### 1️⃣ Delegation (위임) — 무엇을 누가 할까

> "이 일을 사람이 할까, AI가 할까, 같이 할까?"

이게 모든 협업의 *출발점*. 잘못 정하면 뒤가 다 어긋난다.

**3가지 인식이 필요하다:**

| 인식 | 무엇을 묻나 | 비유 |
|---|---|---|
| **Problem Awareness** (문제 인식) | 내가 *진짜로* 뭘 하려는 거지? | 시험 준비? 무슨 시험? 어떤 식으로 성공? |
| **Platform Awareness** (도구 인식) | 어떤 AI가 이 일에 맞나? | 학교 갈 때 걸을지·자전거 탈지·버스 탈지 |
| **Task Delegation** (작업 분담) | 사람·AI 각자 잘하는 걸 살린다 | 사람: 창의성·판단·맥락 / AI: 속도·일관성·정보처리 |

### 2️⃣ Description (설명) — 어떻게 말할까

> "프롬프트는 *명령*이 아니라 *대화*다."

완벽한 프롬프트를 외우는 게 아니다. AI를 **같이 일하는 동료**처럼 대하면서 조금씩 맥락을 쌓는 것.

**3가지 차원으로 설명한다:**

- **Product Description** — *결과물*에 대한 설명. "이메일 써줘"가 아니라 "300자, 학부모 대상, 정중한 톤, 다음 주 학예회 안내"
- **Process Description** — *어떻게 접근할지*에 대한 설명. "단계별로 생각해줘", "다양한 관점을 고려해줘"
- **Performance Description** — *AI가 어떻게 행동할지*에 대한 설명. "비판적인 편집자처럼", "지지하는 브레인스토밍 파트너로"

### 3️⃣ Discernment (분별) — 결과가 좋은지 어떻게 알까

> "Discernment는 *오류 찾기*가 아니다. *생각의 동료*인지를 판단하는 일이다."

AI의 결과를 *판단하는 안목*. 좋은 것·나쁜 것을 *모두* 알아보는 능력.

**3가지 차원에서 본다:**

- **Product Discernment** — 결과물 자체의 질. 정확한가? 도움이 되나? *내가 못 본 관점*을 보여주나?
- **Process Discernment** — AI가 *어떻게 도달했는지*. 합리적인 가정인가? 논리 흐름이 맞나?
- **Performance Discernment** — AI가 *내가 부탁한 역할*을 잘 수행했나? 적절히 반박했나?

⚡ **Description ↔ Discernment는 끝없이 순환한다.** "이렇게 부탁 → 결과 봄 → 다시 부탁 다듬음" — 이 반복이 **진짜 AI Fluency가 자라는 자리**.

### 4️⃣ Diligence (책임) — 어떻게 책임질까

> "Diligence는 따분한 컴플라이언스가 아니다. *내가 떳떳할 수 있는* AI 사용을 만드는 일이다."

AI를 어떻게 쓰는지에 대한 *나의 책임*. 모든 단계에 걸쳐 있다.

**3가지 차원이 있다:**

- **Creation Diligence** — 어떤 AI를 쓸지, 어떻게 쓸지 신중히 고른다. 개인정보·보안·맥락 적절성.
- **Transparency Diligence** — AI를 어떻게 썼는지 *솔직히 밝힌다.* 숨길 게 없게 일하는 법.
- **Deployment Diligence** — 결과물의 *최종 책임은 나*다. AI가 초안을 써도, 보내는 건 나. AI가 아이디어를 줘도, 고르는 건 나.

## 비유로 이해하기 🪜

**4D는 운전을 처음 배울 때의 4가지 핵심과 닮았다.**

| 4D | 운전 | 무엇을 결정하나 |
|---|---|---|
| **Delegation** | 어디로 갈지·어떤 길로 갈지 정하기 | 목적지·경로 선택 |
| **Description** | 동승자나 내비에게 길을 안내·소통하기 | 방향 지시·의사 소통 |
| **Discernment** | 지금 가는 길이 맞는지 신호·표지·풍경으로 확인 | 상황 판단 |
| **Diligence** | 안전 운전·법규 준수·사고 시 책임 | 책임 |

**하나만 빠져도 사고가 난다.** 목적지 없이 출발하면(Delegation 부재) 길을 잃고, 길 안내 못 하면(Description 부재) 헛돌고, 상황 판단 못 하면(Discernment 부재) 위험에 빠지고, 안전 운전 안 하면(Diligence 부재) 사고 난다.

AI 협업도 똑같다.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "4D는 AI 협업의 4가지 근육이에요. **Delegation**(무엇을 누가), **Description**(어떻게 말할지), **Discernment**(결과를 어떻게 판단할지), **Diligence**(어떻게 책임질지). 네 개가 동시에 돌아가야 진짜 협업이 됩니다."

### 헷갈리기 쉬운 포인트 3가지

1. **Description ≠ 프롬프트 엔지니어링** — "완벽한 한 줄 프롬프트"를 외우는 게 아니다. 대화로 맥락을 쌓아가는 능력.
2. **Discernment ≠ 오류 찾기** — 단점 찾기만이 아니다. *내가 못 본 좋은 점*을 알아보는 것도 포함.
3. **Diligence ≠ 규정 준수** — 규칙 따르기에서 끝나는 게 아니다. "내가 한 일에 떳떳할 수 있나"가 본질.

### 연수에서 활동 아이디어

- **D 카드 뽑기**: 4D 카드 한 장씩 뽑아서, 자기 최근 AI 사용에서 그 D가 어땠는지 1분씩 발표.
- **약점 찾기**: 자기에게 가장 약한 D를 솔직하게 고르고, 다음 주 한 가지 실험 정하기.

## 더 깊이 — 원본 강의의 핵심 문장

> "Each round of conversation deepens the collaboration."
> ─ 대화를 거듭할수록 협업이 깊어진다. 4D는 *체크리스트*가 아니라 *함께 자라는 능력*이다.

## 한 줄 요약

AI에게 **나의 수업 맥락**을 충분히 쌓아주면, AI는 *일반 비서*가 아니라 *우리 반을 아는 동료*가 된다. 코스·차시·학습 목표 설계가 달라진다.

## 핵심 정리

### 수업 설계에서 사람이 늘 하던 3가지 일

AI 얘기 잠시 잊고, 우리가 수업을 설계할 때 늘 하는 일은:

1. **내용·개념 고르기** — 학생에게 꼭 필요한 게 뭐냐
2. **학습 여정 그리기** — 어느 개념이 어디에 와야 이해가 잘 되냐
3. **학습 목표 쓰기** — 이 수업이 끝나면 학생이 뭘 할 수 있어야 하냐

이 셋 모두에 4D가 적용된다.

### 1) 내용·개념 고르기에 4D 적용

- **Delegation** — *내 상황*을 정확히 분류: 큰 주제만 있는 상태? 세부가 흐릿한 상태? 기존 수업 업데이트 중? 상황마다 AI에 부탁할 것이 다르다.

- **Description** — "통계 입문 주제 알려줘" ❌ → "수학 불안이 있는 *언론학과* 학생이 데이터 리터러시를 키워야 한다. *통계가 자기 진로에 의미 있다*고 느끼게 만들 개념을 같이 고르고 싶다" ✅

- **Discernment** — AI가 제안한 개념을 그냥 yes/no 하지 말고, **왜 좋은지 / 왜 별로인지를 AI에게 설명**한다. 다음 제안을 더 정교하게 만든다.

- **Diligence** — 결정을 *기록*하고, *학생에게 공개*한다. "사려 깊은 AI 협업"을 학생에게 보여주는 일.

### 2) 학습 여정에 4D 적용 — *역할 바꾸기* 기법

가장 흥미로운 부분. AI에게 **"우리 학생인 척 해줘"** 라고 요청한다.

> "내 학생 입장으로 이 코스를 따라가본다고 가정해줘. 어디서 헷갈릴 것 같아? 어떤 배경 지식이 필요할까? 한 주제에서 다른 주제로 넘어갈 때 어떤 도움이 필요해?"

→ **상시 가능한 학생 포커스 그룹**을 가지는 셈.

### 3) 학습 목표에 4D 적용

지금까지 AI와 쌓아온 맥락(내 학생들, 내 교수 철학, 내 제약)이 있다면, 이걸 *기반*으로 학습 목표를 만든다. 정확하고, 의미 있고, 학생에게 동기 부여가 되며, 내 교수 철학에 충실하고, 학교 요구에도 맞는 목표.

→ 학습 목표를 **"이력서에 쓸 수 있는 스킬"** 로 매핑해달라고도 해보라. 학생 동기 부여에 강력하다.

### 큰 원칙 — 맥락은 한 번에 쌓이지 않는다

매 대화에서 조금씩. *대화가 길어질수록 더 똑똑해지는 동료*를 만든다고 생각하라.

## 비유로 이해하기 🪜

**AI에게 맥락 쌓기 = 새 학년 첫날 우리 반을 동료에게 인수인계하기**

- 학생 명단만 주면 → "이 학년 보통 ~합니다" 정도의 *일반 조언*만 나온다.
- "민수는 수학 잘하지만 발표가 부담", "지영이는 책 좋아하는데 그룹 활동 약함"을 알려주면 → 진짜 맞춤 조언이 나온다.
- 하루 만에 다 전달할 수도 없다. 학기 내내 조금씩 업데이트하는 거다.

**한 줄 프롬프트가 아니라, 학기 내내 쌓아가는 대화.**

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "수업 설계에 AI를 쓴다는 건, 내 교실 맥락을 AI에게 *조금씩 쌓아주면서* 진짜 동료로 만들어가는 일이에요. '오늘 ~한 활동 만들어줘' 같은 일회성 사용이 아니라요."

### 자주 받는 질문 3가지

**Q. 이거 결국 시간 절약 아닌가요?**
→ 시간 절약은 *부수 효과*. 진짜 효과는 *내가 못 본 가정·맹점을 드러내는 것*, *예상 못 한 개념 연결 발견*입니다.

**Q. 학생에게 AI 썼다고 말해도 되나요?**
→ 말해야 합니다. *책임 있는 AI 사용*을 보여주는 가장 좋은 방법.

**Q. 어디서부터 시작?**
→ 다음 수업 한 차시 설계할 때, AI에게 *우리 반 학생 상황*을 먼저 5분 설명하고 시작해보세요.

### 연수에서 활동 아이디어

- **맥락 카드 쓰기**: 자기 반에 대해 AI에게 알려줄 5가지 카드 (학습 수준, 흥미, 어려워하는 점, 강한 점, 작년 활동).
- **역할 바꾸기 실습**: 자기 차시 계획 한 장을 AI에게 보여주고 "우리 반 학생인 척 반응해줘" 시켜보기.

## 더 깊이 — 원본 강의의 핵심 문장

> "You're planning a course, but more importantly, you're building a thinking partnership."
> ─ 코스를 짜고 있는 게 맞지만, *더 중요한 건* 너의 교수 실천 전반을 키워줄 *생각의 동료 관계*를 짓고 있다는 것.

## 한 줄 요약

활동지·평가·과제는 *맥락이 누적된* AI와 함께 만들 때 비로소 "내 학생을 위한 자료"가 된다. 시간 절약이 아니라 **자료의 *결*이 달라진다**.

## 핵심 정리

### 자료 제작에 4D 적용 — 시나리오로 따라가기

상황: *통계 수업, 언론학과 학생들이 영가설/대립가설 개념을 어려워한다.* 활동지가 필요하다.

#### Delegation
- **Problem Awareness**: 학생이 *무엇* 때문에 헷갈리는지 안다 — "변수가 명확하지 않을 때 어려워한다"
- **Platform Awareness**: 다양한 연습 문제 생성에 AI가 강하다
- **Task Delegation**: 나는 *학생 혼란 지점*을 정의, AI는 *다양한 시나리오* 생성, 함께 다듬기

#### Description — 한 줄이 아니라 *층층이*

이미 AI와 쌓아온 맥락 위에:

> "기억하지? 우리 언론학과 학생들은 추상보다 *구체 예*가 먼저 필요해. 지난 주 소셜미디어 분석 예시를 이어서 영가설 활동지 만들자."

**Product Description** (결과물): "명확한 번호 매김, 학생 작업 공간 포함, 정답지는 별지로."

**Process Description** (접근 방식): "먼저 변수 식별의 주된 오해를 짚을 것. 각 문제는 학생 일상의 친숙한 시나리오로 시작. 변수 식별 → 가설 작성 순서로. 난이도 점진적."

**Performance Description** (행동 톤): "시나리오는 창의적으로, 단 언어는 10학년 수준. 너무 복잡해 보이는 문제는 표시해줘."

#### Discernment
- AI가 친숙 시나리오를 잘 살림 → "*이래서* 좋아"를 설명 → 다음 제안 더 정교해짐
- 너무 복잡한 제안 → "*이래서* 안 맞아"를 설명 → 맥락이 또 쌓임
- 좋은 Discernment는 **문제 발견 + 가능성 발견** 둘 다.

#### Diligence
- **Creation Diligence**: 민감한 학생 정보 보호. 인용은 학생에게 요구하는 만큼 *나도* 제대로.
- **Transparency Diligence**: "Diligence Statement"를 자료 끝에 짧게 — *학생도 본보기로 본다.*
- **Deployment Diligence**: 정확성·편향·오류·목표 정합성을 *내가* 최종 확인.

### 자료가 *일관성*을 갖는다 — 4D의 *덤*

AI에 맥락이 누적되어 있으면, 만든 자료들이 자동으로 *연결*된다:

- 이 실험이 활동지와 어떻게 연결되는가
- 학생들이 어떤 준비를 했는가
- 이게 커리큘럼에서 어디로 이어지는가
- 학생에게 어떤 수준의 지원이 필요한가

→ 자료가 *우연한 모음*이 아니라 *의도된 학습 경험*이 된다.

### AI 시대의 평가 — 큰 도전

AI는 많은 과제를 학생 수준 이상으로 풀 수 있다. 쉬운 답은 없다. 하지만 4D가 도움:

- *동료·학생과 함께* 우리의 우려·기준을 *명확히 한다* (Diligence의 출발점)
- 그 합의가 과제·평가 설계에 *직접 반영*된다

→ "AI 못 쓰게 막기"보다 *"AI와 함께도 깊은 이해를 보일 수 있는 평가"*. (TAIF 코스에서 더 깊이.)

## 비유로 이해하기 🪜

**맥락이 쌓인 AI와 자료 만들기는, 우리 반을 잘 아는 선배 교사와 옆자리에서 활동지를 짜는 것과 같다.**

- 일반 AI = 잠깐 도와주러 온 다른 학교 선생님 → "*보통* 이렇게 해요"
- 맥락 쌓인 AI = 우리 반 사정을 아는 옆 반 베테랑 선생님 → "*너희 반 그 친구가 어려워한다 그랬지? 그럼 이렇게*"

**핵심 능력은 프롬프트가 아니라 *내 분야와 학생을 깊이 아는 것*.** AI는 그 깊이를 *증폭*시킨다.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "학습 자료를 AI와 만든다는 건, *대화를 통해 점점 더 우리 반다워지는 자료*를 만드는 일이에요. 같은 활동지라도 *맥락 없이 한 번에 뽑은 것*과 *대화로 다듬은 것*은 결이 달라요."

### 가장 헷갈리는 포인트

**"AI가 학생 과제를 풀 수 있는데, 왜 과제를 내요?"**
→ 강의의 답: 과제의 본질을 *결과물 채점*에서 **학생의 사고 과정·AI 협업 능력 평가**로 옮긴다. *AI와 함께도 깊은 이해를 보이는 평가*가 새로운 표준.

### 연수에서 활동 아이디어

- **활동지 비교**: 같은 차시용 활동지를 (1) AI에게 일반 프롬프트로 1분 만에 뽑은 것과 (2) 학생 맥락 5분 설명하고 대화로 다듬은 것을 비교.
- **Diligence Statement 쓰기**: 자기 최근 자료 하나에 "이걸 만들 때 AI를 어떻게 썼는지" 3~5줄 부록.

## 더 깊이 — 원본 강의의 핵심 문장

> "You just need to recognize how to apply your existing teaching and subject matter expertise to your AI collaborations."
> ─ AI에 능숙한 교사가 된다는 건, *비밀 프롬프트*를 외우는 게 아니다. *이미 가진 교수·전공 전문성*을 AI 협업에 어떻게 적용할지를 *알아보는 것*이다.

metaphor: "4D는 자전거 부품 같다. 처음엔 부품을 하나씩 알려주지만(선형), 결국 *타는 법*은 부품을 동시에 다루는 일이다(두 루프)."

## 한 줄 요약

이 코스는 4D를 학생·동료에게 *어떻게* 가르칠지를 다룬다. 그 출발점은 **'어떤 접근법으로 소개할 것인가'** 다.

## 코스 전체가 답할 3가지 질문

1. **Lesson 1: 어떻게 *소개*할까?** (교수법) ← 지금 여기
2. **Lesson 2: 학생이 *제대로 이해했는지* 어떻게 알까?** (평가)
3. **Lesson 3: 내 *분야와 어떻게 연결*할까?** (커리큘럼 통합)

## 프레임워크의 두 얼굴

이 프레임워크는 두 가지 일을 한다:

- **기술(describe)** — 사람이 AI와 일할 때 실제로 *뭐가 벌어지는지* 지도처럼 그린다.
- **안내(prescribe)** — 더 *잘하려면 어떻게 해야 하는지*를 보여준다.

학생도 둘 다 이해해야 한다 — *지금 무슨 일이 벌어지나*, 그리고 *어떻게 해야 더 나아지나*.

## 4가지 접근법

### 접근법 1 — 단계별 (Linear / 폭포수)

D → D → D → D 순서로 차근차근. **AI 처음 다루는 학생**에게 가장 직관적.

> 예: 4부 과제 — (1)Delegation 계획 → (2)Description 실습 → (3)Discernment 평가 → (4)Diligence 토론.

장점: 부담 적고 단계 명확. 단점: 실제 AI 사용은 순서대로가 아니라는 점.

### 접근법 2 — 어디든 시작 (Non-linear)

4D는 사실 *서로 얽힌 시스템*. **AI 경험이 있는 학생**에게 좋다 — 실제 상황의 *복잡성*을 담는다.

- Discernment 중 문제 발견 → Delegation 재검토
- Diligence(개인정보) → Description 방식 변경
- Description 어려움 → Delegation 목표 재정의

**케이스 기반 학습·그룹 프로젝트**와 잘 맞는다.

### 접근법 3 — 한 D만 깊이 (Focused)

특정 워크숍·세미나용. 예: *Description*만 1회차 통째로, 또는 *Discernment*만 3회차 시리즈로.

장점: 4가지 다 동시에 다루는 인지 부담 없이 한 영역의 *깊이*.

### 접근법 4 — 두 루프 (Two Loops) ⭐ 가장 정교한 관점

4D를 두 개의 *맞물린 루프*로 본다.

| 루프 | 무엇을 다루나 | 어떤 결정? |
|---|---|---|
| **Delegation ↔ Diligence** | 큰 그림 — 전략·윤리 | 무엇을 할 것인가? 어떻게 나눌까? 어떤 시스템이 내 가치와 맞나? |
| **Description ↔ Discernment** | 순간순간 — 전술·반복 | 이 요청을 어떻게 전달하지? 결과는 기준에 맞나? |

두 루프는 **끊임없이 서로 영향**을 준다. 전략이 전술을 빚고, 전술의 발견이 전략을 다시 흔든다.

### 어떤 접근법을 쓸지

- AI를 *처음*인가 → **1번 (선형)**
- AI 경험 있고 *복잡성*을 다루고 싶나 → **2번 (비선형)**
- 한 회차·한 주제에 *깊이*가 필요하나 → **3번 (한 D)**
- *고급 통합*과 *전문가 수준* 사고를 키우고 싶나 → **4번 (두 루프)**

수업이 길어지면 1 → 4로 *옮겨가는* 경우가 많다.

## 비유로 이해하기 🪜

**4D를 가르치는 건 자전거 가르치기와 비슷하다.**

- 처음엔 **부품을 하나씩** 알려준다 — 페달, 브레이크, 핸들, 안장. (접근법 1·3)
- 그러다 부품 *연결*을 가르친다 — 핸들 꺾으면 무게 중심도 바뀐다. (접근법 2)
- 결국 *타는 일*은 부품을 **동시에 다루는 일**이다. (접근법 4)

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "AI Fluency를 가르치는 방법은 한 가지가 아니에요. 학생 상황에 따라 4가지 접근법 중 골라요. 도착점은 *두 루프*를 자유롭게 오가는 사고예요."

### 자주 받는 질문 2가지

**Q. 학생 수준이 다 다른데, 어떤 접근법이 좋아요?**
→ 시작은 1번(선형). 익숙해지면 2~4번으로 자연스럽게 옮겨가도 됩니다.

**Q. '두 루프'가 어렵게 들리는데요.**
→ 학생에게 처음부터 두 루프를 보여주지 않아도 돼요. *우리(교사)가 이걸 알고* 가르치면, 차차 학생도 통합을 발견합니다.

### 연수 활동 아이디어

- **접근법 매칭 카드**: 4가지 학생 상황 + 4가지 접근법 짝짓기.
- **두 루프 시범**: 자기 최근 AI 사용을 두 루프로 그려보기.

## 더 깊이

> "Teaching AI Fluency is about helping students develop values, judgment, and practical skills."
> ─ *가치·판단·실용 능력*을 키우는 일. *더 사려 깊은 인간-AI 협업*을 길러주는 일.

## 한 줄 요약

학생이 "AI를 *어떻게 쓸까*"를 넘어 "AI에 대해 *좋은 결정을 어떻게 할까*"를 묻게 만드는 것 — 그게 Delegation–Diligence 루프다.

## 핵심 정리

### 두 묶음의 6개 하위 능력 — 한 대화의 부분이다

핵심 인사이트: Delegation 3개 + Diligence 3개는 *따로따로의 체크리스트*가 아니다. **하나의 대화**다.

**Delegation 쪽 (무엇·누가)**
- Problem Awareness — 지금 하려는 게 정확히 뭐지?
- Platform Awareness — 어떤 AI가 이 일에 적합한가?
- Task Delegation — 사람·AI·합작, 어떻게 나눌까?

**Diligence 쪽 (윤리·책임·투명성)**
- Creation Diligence — 협업 자체의 윤리는?
- Transparency Diligence — AI 역할을 어떻게 밝힐까?
- Deployment Diligence — 최종 결과의 책임은 어떻게 지나?

### 루프 1: Delegation → Diligence

예: 학생이 *디지털 프라이버시 정책 브리프*를 쓴다.

1. 목표 정의(Problem): "정책 권고안 작성"
2. 도구 비교(Platform): 데이터 분석·작문 능력 비교
3. 분담(Task): 초기 조사는 AI와 함께, 권고는 학생만

→ 여기서 *바로* Diligence 질문이 따라온다:
- 이 AI에 정책 이해관계자 정보 공유해도 되나? (Creation)
- AI 역할 어떻게 표시? (Transparency)
- 사실 검증은? (Deployment)

### 루프 2: Diligence → Delegation (반대 방향) — 진짜 *아하 모먼트*

책임감이 *전략*을 바꾼다.

예: 학생이 *지역사회 프로젝트*. 인터뷰 응답자의 *목소리를 정확히 대변*해야 한다는 깊은 책임감(Deployment Diligence). → 자연스럽게 Delegation을 *수정* → "AI는 패턴 분석만 돕고, *서사 해석은 내가*."

> **책임감이 더 좋은 Delegation을 만든다.** 책임감은 능력을 *제한*하지 않는다. *명료하게* 한다.

### 가르치는 단계별 가이드

**Delegation → Diligence 방향**

학생에게 묻게 한다:
1. 내가 이루려는 게 뭐지? (Problem)
2. 어떤 AI가 가능하지? (Platform)
3. 이 일을 어떻게 나누지? (Task)

그 다음:
4. 내 도구 선택을 보면, 어떤 윤리 문제가?
5. AI 사용을 누가 알아야 하나? 안 밝히면?
6. 품질·정확성은 어떻게 검증?

**Diligence → Delegation (역방향)**

1. 내 윤리적 의무는? (Creation)
2. 어떤 투명성이 요구되나? (Transparency)
3. 최종적으로 내가 책임지는 건? (Deployment)

그 다음:
4. 이 의무 채우려면 AI와의 일을 어떻게?
5. 어떤 AI가 이 가치와 맞나?
6. 어떤 작업은 *반드시 사람*이?

### 양방향 시나리오 수업

프로젝트 브리프 하나 주고 **양방향으로** 따라가게 한다:

- 한 번은 Delegation 시작 → Diligence로
- 다음은 "학교가 모든 AI 사용 표시 요구" 같은 *Diligence 제약*으로 시작 → Delegation 재편

마지막에 두 결과를 비교 → **어느 쪽이 더 풍부한 통찰을 주는지** 토론.

### 잘 작동하는 신호

- "왜 이렇게 했는지"를 *근거와 함께* 말할 수 있다
- *제약*을 *창의의 촉매*로 본다
- *확장된 협업*도 자신 있게 — 책임 체계가 명확하니까

## 비유로 이해하기 🪜

**Delegation–Diligence는 여행 계획의 두 측면이다.**

- Delegation = "어디 갈지·어떻게 갈지" — 목적지·교통수단·동행
- Diligence = "안전·예의·책임은 어떻게" — 보험·매너·뒷정리

두 측면은 *서로의 답을 바꾼다*:
- 산악 트레킹이 위험하다는 걸 *Diligence*가 알려주면 → *Delegation*이 코스를 바꾼다
- *Delegation*이 "가족 동반"을 정하면 → *Diligence*가 보험·예방접종을 챙긴다

여행 잘 다녀온 사람은 둘을 *동시에* 머리에 굴린다. AI 협업도 똑같다.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "Delegation-Diligence 루프는 학생에게 'AI를 어떻게 쓸까'에서 'AI에 대해 *좋은 결정*을 어떻게 할까'로 사고를 옮겨주는 도구예요. 책임감이 부담이 아니라 *명료함*을 준다는 게 핵심이에요."

### 학생이 자주 보이는 오해 2가지

1. **"투명하게 밝히면 점수가 깎인다"** → 정반대. 어떻게 협업했는지를 *명확히* 보여주는 건 *전문 역량*.
2. **"Delegation 끝나면 Diligence 챙긴다"** → Delegation 정하는 순간 *바로* Diligence가 따라온다. 그리고 Diligence 답이 종종 Delegation을 *다시 흔든다*.

### 연수에서 활동 아이디어

- **양방향 시나리오**: 한 프로젝트 브리프로 두 방향 따라가기. 결과 비교.
- **Diligence 제약 카드**: "개인정보 포함", "상업 출판 예정", "초등생 대상" 같은 카드 뽑아서 Delegation을 어떻게 *재편*하는지 토론.

## 더 깊이

> "Constraints become creative catalysts to spark better ideas."
> ─ 제약이 더 나은 아이디어의 *촉매*가 된다. 책임은 능력을 *축소*하지 않고 *명료하게* 한다.

## 한 줄 요약

학생이 *명령*이 아니라 *대화*로, *프롬프트*가 아니라 *인지 환경(cognitive environment)*을 짓도록 가르치는 일. 이게 가장 학생에게 와닿는 루프다.

## 핵심 정리

### 발상 전환 — *프롬프트*에서 *대화*로

학생의 흔한 모델: AI = 컴퓨터에 명령어 치는 도구.
이 루프가 가르치는 모델: AI = *함께 일하는 동료*. 명령이 아니라 대화. 입력-출력이 아니라 *맥락 공유*.

이 발상 전환이 *결정적*:
- 다른 사람의 프롬프트를 *복붙*할 필요 없어진다
- AI가 바뀌어도 *적응할 수 있다*
- 협업의 *깊이*가 생긴다

### 인지 환경이란?

좋은 *동료*와의 일을 떠올려보자:
- 서로의 아이디어 위에 쌓아간다
- *암묵 지식*과 *축약어*가 생긴다
- 언제 밀어붙이고 언제 응원할지 안다
- *함께 생각*하는 법을 배운다

→ 이게 우리가 **AI와 함께 짓는 환경**. 한 번의 프롬프트로 못 짓는다. 시간이 쌓여야 한다.

인지 환경에 누적되는 것:
- *공유 어휘·참조*
- *합의된 목표·가치·방법*
- *효과적인 상호작용 패턴*
- *이전 대화를 이어가는 메커니즘*

### 3P — 협업의 3가지 렌즈

#### Product (결과물)

예: *"청소년과 SNS 영향에 대해 써줘"* → 너무 일반적 → 다시: *"청소년이 플랫폼마다 *다른 자아*를 보이는 방식으로 분석"* → 더 다듬어 *"플랫폼마다 다른 페르소나 유지의 *심리적 비용*을 독자가 이해하도록"*

매 반복마다 결과물과 *학생 본인의 생각*이 *함께* 명확해진다. 이게 augmentation의 본질.

#### Process (방식)

예: "분석해줘" → "단계별로" → *"문서 분석 시: (1) 저자 맥락 (2) 본문·누락 (3) 다양한 해석 비교 (4) 결론"*

Process Discernment로 평가: 이 방식이 통찰을 *드러내고* 있나? 시간이 지나며 *정교해지고* 있나?

#### Performance (행동)

예: 격식 일반 톤 → "엄격하지만 친절한 회의론자로. 약점을 짚되 자신감을 키우는 방식으로" → "초기 아이디어 단계엔 비판 보류, 충분히 발전 후에"

학생의 *학습 스타일·기분·과제 종류*에 맞게 AI의 *함께 있는 방식*을 조율.

### 학생이 이 루프를 배우게 하려면

1. **한 줄 프롬프트 과제 *없애기*** — 단발 입력은 인지 환경을 안 가르친다. *여러 회 상호작용* + *여러 대화*에 걸친 과제.
2. **교사 자신의 협업 *과정* 보여주기** — *어디서 막혔고 어떻게 풀었는지*까지.
3. **결과가 아니라 *진화* 기록** — *대화의 변화*를 문서화. 공유 언어, 패턴, 3P 상호작용.

### 잘 작동하는 두 신호

1. **공유 언어** — 짧은 단어·예시·문제 틀이 *서로 통한다*. 오래 같이 일한 동료처럼.
2. **탐색적 태도** — *명령형*("X 해줘, Y 해줘")이 *유연하고 호기심 있는* 협업으로 바뀐다.

### 두 루프 — 최종 연결

- **Delegation-Diligence**가 *그릇*을 만든다 — 무엇을 만들지·어떻게 책임질지의 전략 컨테이너.
- **Description-Discernment**가 그 그릇을 *살아 있는 협업*으로 *채운다*.

두 루프를 자유롭게 오갈 수 있게 되면 — 그게 AI Fluency의 *완성된* 모습.

## 비유로 이해하기 🪜

**한 번의 프롬프트 vs Description-Discernment 루프 — '첫 만남' vs '동료 관계'**

- 한 번 프롬프트 = 길에서 인사만 나누고 헤어진 첫 만남. 다음에 만나도 다시 처음부터.
- Description-Discernment 루프 = 같이 일하면서 *서로의 작업 방식*을 배운 동료. 짧은 한 마디로도 통한다.

**3P 비유:**
- Product = "*무엇을* 같이 만들까"
- Process = "*어떻게* 같이 만들까"
- Performance = "*어떤 분위기로* 같이 일할까"

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "Description-Discernment 루프는 학생에게 'AI는 명령하는 도구가 아니라 *맥락을 쌓아가는 동료*'라는 발상을 가르치는 일이에요. *대화의 진화*를 만드는 능력이죠."

### 학생이 자주 빠지는 함정 3가지

1. **한 줄 프롬프트로 끝낸다** — *대화*가 없으면 인지 환경이 안 생긴다.
2. **결과만 평가한다** — 과정도 평가해야 학생이 *루프*를 배운다.
3. **"좋은 프롬프트"를 외운다** — 외운 건 새 AI에선 쓸모없다. *짓는 법*을 가르쳐야.

### 연수에서 활동 아이디어

- **대화 진화 일지**: 같은 과제로 *3회 이상의 대화*를 기록 → 어휘·패턴 분석.
- **3P 카드**: 자기 최근 AI 대화를 3P 카드에 분류 → 약한 곳 발견.

## 더 깊이

> "Students can go beyond getting what they asked for to discovering what they didn't know to ask."
> ─ 학생은 *요청한 것을 얻는 단계*를 넘어 *물어볼 줄도 몰랐던 것을 발견*하는 단계까지 갈 수 있다.

## 한 줄 요약

학생이 *클릭만 잘하는지* vs *진짜 협업 능력*을 키우는지 — 어떻게 구별하나? **결과·과정·성찰 세 관점**을 *함께* 본다.

## 핵심 정리

### 세 가지 평가 관점

| 관점 | 본다 | 묻는다 |
|---|---|---|
| **Outcome-based** (결과) | AI 협업으로 *만들어낸 산출물* | 목표를 이뤘나? 품질은? |
| **Process-based** (과정) | *시간 흐름 속의 협업* | 반복·재시도·전환 패턴은? |
| **Reflection-based** (성찰) | *메타인지* | 무엇이 통했고 왜? 무엇을 배웠나? |

**셋을 *통합*해야 한다.** 한 가지만으로는 클릭 잘하는 학생과 진짜 협업하는 학생을 구별 못한다.

### 4D × 세 관점 — 평가 매트릭스

**Delegation**
- Outcome: 분담 계획이 합리적인가? 목표가 현실적? 도구 선택?
- Process: AI와 *분담 결정 과정*을 보여주는 주석 채팅 로그
- Reflection: 왜 그렇게 정했나? 다른 선택지는?

**Description**
- Outcome: 프롬프트 품질·맥락 제공·*초기→최종 프롬프트의 진화*
- Process: 대화 로그의 *반복적 다듬기·실패와 전환·맥락 쌓기*
- Reflection: 어떤 소통이 잘 통했고 왜? 다른 과제엔 어떻게 다르게?

**Discernment**
- Outcome: AI 출력에 학생이 단 *주석* (좋은 점·약한 점), 채택/수정/폐기 결정 로그
- Process: 대화 내 *실시간 평가 코멘트·오류 발견과 수정·패턴 인식*
- Reflection: 평가 기준이 어떻게 진화했나? 처음에 놓쳤던 것은?

**Diligence**
- Outcome: Diligence Statement 품질, 출처 표기, 사실 확인 흔적
- Process: 데이터 다루기, 협업 전·중·후의 윤리적 결정, 민감 정보 처리
- Reflection: 어떤 윤리적 딜레마? 책임을 어떻게 이해? 다음엔?

### 통합 평가 예시 — *AI 시대 사회 영향* 에세이

**제출물 (4가지)**: 최종 에세이 / AI 대화 기록 / Diligence Statement / 학습 일지.

**Outcome 각도**: 에세이가 요건을 충족? 인간 검토 흔적이 분명? Statement가 *투명*한가?
**Process 각도**: 학생이 *맥락 쌓기*를 잘했나? 프롬프트가 *다듬어졌나*? 전환·수정이 보이나?
**Reflection 각도**: 무엇이 통했고 안 통했는지 *설명*할 수 있나? *다음 개선*이 명확한가?

### 평가 운영 4원칙

1. **Outcome·Process·Reflection을 *함께***
2. **관찰 가능한 행동·구체 아티팩트**에 초점
3. **능력마다 다른 평가 방식**
4. **평가를 *학습 기회*로** — 측정만이 아니라 *학생이 자기 성장을 인식*하게

## 비유로 이해하기 🪜

**AI 협업 평가 = 요리 평가**

요리 학원에서:
- **Outcome** = 완성된 음식 맛·모양 — 결과만 보면 빠르지만 *재현 가능성*을 알 수 없다
- **Process** = 칼질·불 조절·시간 관리 — *습관·실력*이 보인다
- **Reflection** = "뭐가 잘 됐고 뭘 다음에 다르게?" — 성찰이 있으면 *계속 성장*

셋을 합쳐야 *진짜 요리사*가 보인다.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "4D 평가는 *완성품*만 보는 게 아니라 *과정*과 *성찰*을 함께 봅니다. 셋을 합쳐야 학생이 진짜 협업 능력을 키우는지, 운이 좋았던 건지를 구별할 수 있어요."

### 자주 받는 질문 2가지

**Q. 평가물이 너무 많아져요. 시간이 안 돼요.**
→ (a) 세분화된 *산출물 루브릭* (b) *자기·동료 평가* 활용 (c) *5분 컨퍼런스*로 서면 피드백 대체 (d) *전체 로그를 다 읽지 말고*, 학생이 *주요 지점을 표시*하게.

**Q. 어떤 4D부터?**
→ Discernment부터. 가장 *눈에 보이게* 만들기 좋고, *비판적 사고*에 직접 효과.

### 연수에서 활동 아이디어

- **평가 매트릭스 만들기**: 자기 과목 한 과제로 *4D × 3관점 = 12칸* 채우기. *지금 비어 있는 칸*을 발견.
- **3관점 우선순위 토론**: 어떤 관점이 가장 중요한지, 왜.

## 더 깊이

> "Make assessment a learning opportunity, not just a measurement."
> ─ 평가를 *학습 기회*로. 학생이 자기 성장을 *인식하고 가치 있게 여기게* 도와라.

## 한 줄 요약

평가 관점(Outcome / Process / Reflection)을 **실제 과제**로 옮긴다. 진정성·반복·투명성 세 원칙을 지키며, 평가물 *양 폭증* 문제도 함께 해결한다.

## 핵심 정리

### 과제 설계 3원칙

1. **진정성(Authenticity)** — *실제 세계의 AI 협업*을 닮은 과제. 인위적 연습 X.
2. **반복(Iteration)** — 단발 과제 금지. 다듬고 다시 시도할 기회를 *과제 안에*.
3. **교육적 투명성(Pedagogical Transparency)** — 학생에게 *분명히*: "*결과*만이 아니라 *협업 과정*과 *너의 성찰*도 평가한다."

### Outcome-based 과제 유형

- **AI 출력 개선하기**: 평범한 AI 출력을 *훌륭한* 결과로 다듬게. Discernment + Description.
- **산출물 비교하기**: 같은 과제를 *여러 AI*·*여러 모드*로 시도 후 분석. Platform Awareness + Discernment.
- **제약 기반 도전**: 형식·길이·스타일·청중 같은 *명확한 제약* + 최종 결과물 + *프롬프트*. Description 정밀성. 윤리·법·전문 기준을 제약에 넣으면 Creation Diligence도.
- **동료 산출물 평가**: 자기 목표 정해 AI와 작품 만들기 → 짝과 교환해 *목표 대비* 평가.

### Process-based 과제 유형 — 가장 어려운 영역

협업은 *눈에 안 보이고 휘발성*. 4가지 접근:

- **주석 달린 채팅 로그**: 자기 대화에 *핵심 순간*(통찰·도전·성장)에 코멘트. *전환점*과 *회복*을 표시.
- **녹화 내레이션**: AI와 일하는 *실시간*을 화면 캡처·오디오와 함께. 결정·평가 기준을 *말로*.
- **과정 플레이북**: 본인의 *AI 전략 가이드* — 과제 종류별 자기 프롬프트·기법·도움. 학생의 *지속 가능한 참고서*.
- **AI·동료 디브리핑**: 채팅 로그를 *AI 또는 동료*와 다시 토론. 둘 다 시도해 비교.

### Reflection-based 과제 유형 — *메타인지*

핵심 문제: *성찰 피로*. *다양화*가 관건.

- **가이드 인쿼리**: 특정 과제에 *구체 질문*으로 성찰. 솔직한 비판도 환영.
- **학습 일지**: 학기 내내 *여러 시점*에 4D 자기 평가 + *증거*. 비디오·인포그래픽 등 *형태 다양화*.
- **시나리오·사례 연구**: 가설/실제 사례에 학습을 *적용*. 예: *"새 상사가 채용 결정에 AI 쓰자고. 어떻게 조언?"*
- **개인 정책 선언서(Personal Policy Statement)** ⭐ 가장 강력. 자기 가치·전략·방법으로 *나의 AI 협업 원칙*을 작성. *임파워먼트*와 *책임감* 동시에.

### 평가물 폭증 — 현실적 4가지 해결책

1. **세분화된 산출물 기반 루브릭** — 학습 결과와 *타이트하게 정렬*.
2. **자기·동료 평가 적극 활용** — 학생이 자기·동료 성장을 *가장 잘 관찰*.
3. **번개 컨퍼런스** — 일부 서면 피드백을 *5분 토론*으로.
4. **선택적 샘플링** — 전체 채팅 로그를 *다 읽지 말 것*. 학생이 *주요 순간 표시*하게.

## 비유로 이해하기 🪜

**AI 협업 과제 = 피아노 레슨**

피아노 선생님이 학생을 키울 때:
- 한 곡을 *완주*만 보면 안 된다 — 그게 Outcome.
- 손가락 모양·자세·페달링도 본다 — 그게 Process.
- "이번 곡에서 뭘 배웠고 다음 곡엔 어떻게?"도 묻는다 — 그게 Reflection.

**셋이 합쳐져야 *다음 곡*도 칠 수 있다.**

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "4D 과제 설계의 핵심은 *진정성·반복·투명성* 세 원칙. *결과·과정·성찰* 세 관점이 모두 들어간 과제가 학생을 진짜 협업자로 키워요. 평가 부담은 *자기·동료 평가*와 *짧은 컨퍼런스*로."

### 자주 받는 질문 2가지

**Q. 한 학기에 다 적용하기 부담.**
→ 한 학기 *한 가지*로 시작 — "Personal Policy Statement" 하나만 학기말에 넣어도 큰 변화.

**Q. 학생이 과정을 어떻게 보여줄지 모르겠대요.**
→ 교사가 먼저 *시범*. 본인 AI 협업 대화에 *주석 달아* 보여주면 학생이 본보기로 배움.

### 연수 활동 아이디어

- **과제 변환 워크숍**: 기존 과제 1개를 *3관점 모두 들어가게* 다시 설계.
- **Personal Policy Statement 직접 쓰기**: 교사 본인이 먼저. 학생 시키기 전에 *내 정책*을.

## 더 깊이

> "Designing AI Fluency assignments is about creating opportunities for genuine learning through the practical application of the framework itself."

## 한 줄 요약

AI는 *분야마다 다르게* 흔든다. 내 교과의 *커리큘럼·교수법·평가*가 어떻게 흔들리는지 진단하고, 답을 *동료·학생과 함께* 만든다.

## 핵심 정리

### 출발 — *전문성은 사라지지 않는다, 토대가 된다*

AI Fluency는 우리 전문성을 *없애는 일*이 아니다. *증강*시키는 일. 우리 분야 지식은 *전무후무한 성취의 토대*. 이걸 *우리부터* 믿고 학생에게도.

### 우리 졸업생이 마주할 3가지 질문

- **무엇이 자동화될까?** — 어떤 일상 업무가 AI에? 우리 수업은 어떻게?
- **어디가 협업의 황금 지점인가?** — *분야 전문성 + AI 능력*을 함께 키울 영역.
- **누가 책임지나?** — AI가 *독립적으로* 일할 때 학생이 어떻게 관리·책임?

### 교사가 *이미 가진* 세 전문성

1. **분야 전문성** — *내용·가치·방법·사고방식*. 어떤 능력이 기초이고 어떤 게 주변부.
2. **교수 전문성** — *우리 분야 학생*이 어디서 막히고 어디서 도약. *감정의 여정*.
3. **평가 전문성** — 진짜 이해를 *알아볼 줄 안다*. AI가 있든 없든.

AI Fluency 작업은 이 세 전문성에 *얹어*간다.

### AI가 흔드는 세 영역

#### 1. 커리큘럼

학생이 묻는다 — "*AI가 검색해주는데* 왜 연구 방법?" "*AI가 글 쓰는데* 왜 글쓰기?"

→ *분야별 설득력 있는 답*이 필요. 동료와 함께 진단:
- 우리 분야에서 AI가 *자동화 가능*한 것은?
- 어떤 기초 개념이 AI 시대에 *더/덜* 중요?
- AI *증강*이 우리 분야 *모범 실천*을 어떻게?
- 학생이 AI 에이전트를 *효과적으로 지시*하려면 어떤 기초?

#### 2. 교수법

개인 맞춤 튜터링·인터랙티브 시뮬레이션·즉각 피드백 — *지금 가능*. 하지만 *모든 AI 도움이 학습을 돕지는 않는다*. 어떤 건 *지름길*만 만든다.

진단:
- 우리 분야에서 AI가 *학습을 도울* 방식?
- AI가 *학습을 방해할* 방식?
- AI를 *인터랙티브 학습 환경·파트너*로?
- *권장* 교수법과 *피해야 할* 교수법?

#### 3. 평가 — 가장 시급

학생이 *몇 초 만에* 에세이를 만드는 시대. *진짜로* 무엇을 평가?

진단:
- 우리 분야에서 *AI 도움 작업의 진정한 학습 시연*은?
- AI로 *지름길 안 통하는* 과제 설계? 혹은 *AI와 함께라야 더 깊은 이해*?
- 결과만이 아니라 *과정과 성장*을 가치 있게 보는 평가?
- *AI를 못 쓰게 막기*보다 *AI와 비판적으로 일하는 능력*을 평가하는 방향?

### 결론 — 사람만이 할 수 있는 일에 닻을 내려라

모든 분야에서 사람이 *대체 불가하게* 가져오는 것:
- 분야 전문성
- 실세계 맥락
- 모호하고 어수선한 상황에서의 *판단*
- 창의적 문제 해결
- 윤리적 추론
- 관계 짓기

**우리 일은 AI가 *이것들을 증폭*시키게 만드는 것.**

## 비유로 이해하기 🪜

**AI는 내 분야에 부는 바람이다.**

- 같은 바람도 어떤 나무는 *흔들기만*, 어떤 나무는 *부러뜨린다*.
- 내 교과가 *어떤 나무*인지 알아야 — 깊이 뿌리내린 부분과 가지 부분.
- 무작정 *방풍림*을 치는 건 답이 아니다 (학생은 결국 바람 부는 들판으로).
- *어떤 가지를 다듬고 어떤 뿌리를 더 깊이 박을지* — 이게 우리 일.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "AI는 분야마다 다르게 영향을 줘요. 우리 일은 *내 분야 어디가 흔들리고 어디가 단단한지* 진단하고, 커리큘럼·교수법·평가를 다시 빚는 거예요. 우리 전문성이 *사라지는 게 아니라 더 중요해진다*는 게 출발점."

### 학교에서 자주 빠지는 함정 3가지

1. **금지를 답으로** — 거의 불가능. 학생은 결국 쓴다.
2. **모든 분야를 똑같이** — 수학·미술·역사가 받는 영향이 다 다르다.
3. **혼자 고민** — 분야별 진단은 *동료와 함께*가 훨씬 깊다.

### 연수에서 활동 아이디어

- **세 영역 진단 차트**: 자기 교과로 *커리큘럼·교수법·평가* 3칸 — 어디가 흔들리고 어디가 단단한지.
- **학생 질문 시뮬레이션**: "AI가 다 해주는데 왜 *우리 과목*?"에 *자기 분야*만의 답.

## 더 깊이

> "AI Fluency begins and ends with your expertise."
> ─ AI Fluency는 *너의 전문성*에서 시작하고 끝난다.

## 한 줄 요약

4D를 내 분야에 *구체화*하는 작업. 흥미롭게도 — **AI를 안 만져도 되는** 작업이다. 분야 안목·언어·과정·가치를 *명시화*하면, 사람이 *대체 불가*해진다.

## 핵심 정리

### 핵심 발상 — *사람의 역량부터 키운다*

AI 협업 능력은 *내 분야의 좋고 나쁨*을 알아볼 줄 알 때 가능. 그 안목을 *말로 풀어내고 가르칠 수 있을 때*, 학생은 *AI와 같이 일해도 흔들리지 않는다*.

→ 이 작업은 *AI 없이* 한다. 분야의 *암묵 지식*을 *명시화*하는 일.

### Discernment부터 시작한다 — 왜?

> AI 시대 가장 중요한 사람 능력은 *질을 알아보는 안목*이다.

#### 함께 *질 기준* 짓기

"잘 쓴 글", "창의적", "우아한 해법" 같은 *모호한* 표현 너머. *구체적으로* 무엇이 그것을 만드는가?

- 철학 페이퍼를 설득력 있게 만드는 *구체적 무브*는?
- 우아한 공학 해법의 *정확한 특징*은?

→ 학생이 *내면화하고 적용할 수 있는* 디테일한 루브릭으로.

#### 모범 사례 *체계적* 분석

논문·포트폴리오·돌파구 해법을 모아서 *그냥 보여주지 말고* 학생과 *함께 해부*. 텍스트 표시·구조 다이어그램·결정 디코딩. *전문가의 눈*을 학생이 *보게*.

#### *실패* 함께 진단

성공만큼 *실패*도. 망한 논증·버그 코드·실패한 디자인을 *법의학적*으로. 어디서 정확히 무너졌나?

### Description — *내 분야 의사소통*을 *명시*한다

#### 분야의 *산출물* 지도

"실험 보고서"로 끝내지 말고 *정확한 섹션·관례*. 왜 방법이 결과 앞에? 과학 글쓰기에서 수동태는 무슨 일을? 학생이 전문 산출물을 *역공학*해서 *깊은 구조*를.

#### 전문가가 *어떻게 사고하는지* 드러내기

역사가는 사료를 어떻게 *평가*하나? 디자이너는 콘셉트에서 프로토타입으로 어떻게? 미시 결정을 *추적*. 학생이 실무자와 인터뷰하고 *전문가 사고 흐름도*.

#### *분야 규범*에 이름 붙이기

과학자는 그냥 "연구"하지 않는다 — *회의·재현·동료 평가의 구체 프로토콜*. 예술가는 *실험·비평·수정*. "*수학자처럼 생각하기*"는 구체적·관찰 가능한 *행동*으로.

### Delegation — *분야 안에서 무엇을 누가/어떻게*

#### 문제의 *해부*

분야의 전형 작업(예: 문헌 리뷰)을 분해. 어떤 지식·기술·판단? *어디에 AI를*:
- 출처 찾기? *자동화 가능*?
- 관련성 평가? AI가 *증강*?
- 논증 합성? *인간 판단 필요*?
- 최종 서사? *AI와 협업*?

#### AI *가능성 지도*

자동화·증강·에이전트 위임 가능 영역 매핑:
- 어떤 일상 작업을 AI가 *자동화*?
- 어디서 사람-AI *협업이 가치 추가*?
- AI 에이전트가 *독립*적으로 일할 수 있는 곳?

#### 결정 트리

AI(또는 어떤 도구·협력자)를 *언제·어떻게*. 사례 연구로 *위임 결정을 명시화·변호 가능하게*.

### Diligence — *분야 가치*를 *체화*

#### *윤리 프레임워크* 코드화

일반적 학문적 정직성 너머. 우리 분야에서 *"해 끼치지 마"*는 무슨 뜻? AI가 환자 데이터 분석을 도우면 *프라이버시*는? 법률 연구는 *비밀유지*는?

→ *윤리 결정 매트릭스*를 만들어 새 상황에 적용.

#### *투명성 규범* 명확화

분야마다 공개 기대치가 다르다. 학생과 *기존 실천*을 조사·문서화. 언제 *완전 공개*? 언제 *의도적으로 가려*지나? AI 도움을 *연구 논문·창작 포트폴리오·비즈니스 보고서*에서 각각 어떻게?

#### *책임 정책* 공동 작성

기준을 *내려주지 말고*, 학생과 *함께* 짓는다. *왜* 중요한지를 깊이 이해하도록.

### 강력한 피드백 루프

- 질 기준을 말로 풀 줄 아는 학생 → *어떤 출력*도 평가 잘 한다.
- 분야 방법을 이해하는 학생 → *어떤 과정*도 안내 효과적.
- 전문 윤리를 *내면화*한 학생 → *어떤 협업*도 책임 있게.

→ *우리에게도* 이득: 암묵 지식이 *명시*되고, *사람의 고유 기여*가 보이고, *내일의 더 나은 교사·실무자*가 된다.

### 마무리

> *"학생을 AI에 의해 *대체*되도록 준비시키는 게 아니다. *대체 불가하게* 만든다."*

## 비유로 이해하기 🪜

**우리 분야의 *암묵 지식*을 *명시*하는 일은 — '식당 비법 레시피'를 글로 옮기는 일과 같다.**

- 베테랑 요리사는 *손맛*으로 안다. 후추를 *대충 살짝* 친다. 하지만 *얼마인지*, *언제* 치는지, *왜* 그 순간인지를 *말로* 풀어내야 — 후배가 배울 수 있다.
- 우리 분야 안목도 똑같다. *그냥 안다*는 것 너머로, *왜 좋은지·어떻게 알아보는지*를 *말로* 풀어내야 학생이 배운다.
- AI 시대엔 더 중요해진다. AI는 *후추를 친다*. 하지만 *얼마나·언제·왜* — 그건 우리가 가르쳐야 한다.

## 연수 자료 — 동료에게 설명할 때

### 한 줄 정의

> "4D를 내 분야에 구체화한다는 건, 우리 분야의 *암묵 지식*을 *말로 풀어내는* 일이에요. AI 없이도 할 수 있어요. 오히려 AI 없이 *먼저* 해야 사람 역량이 단단해져요."

### 핵심 메시지 3가지

1. **Discernment부터** — *질을 알아보는 안목*이 시급.
2. **명시화가 핵심** — *"우리 분야에선 ~한 게 좋다"*를 *구체적·관찰 가능한* 표현으로.
3. **함께 짓기** — 기준·정책을 *학생·동료와 함께*.

### 연수에서 활동 아이디어

- **암묵 지식 끄집어내기**: 자기 교과 *수업 한 차시*에서 학생에게 했던 평가를 *명시적 기준*으로.
- **AI 가능성 지도**: 자기 교과의 한 작업을 4가지로 — 자동화 / 협업 / 에이전트 / 사람만.

## 더 깊이

> "You're not preparing your students to be replaced by AI. You're preparing them to be irreplaceable."
> ─ 너는 학생을 AI에 *대체되도록* 준비시키는 게 아니다. *대체 불가*하도록 준비시키는 것이다.

이 코스의 결론이자, 모든 차시가 향하던 한 문장.
